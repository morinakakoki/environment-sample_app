<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}iframe{border:0;width:100%;height:100vh;display:block}</style>
</head><body><iframe id="f" src="artifact-inner.html"></iframe>
<script>
// アーティファクトのホストを模擬: 明示テーマなら data-theme を刻む
const t=new URLSearchParams(location.search).get('theme');
document.getElementById('f').addEventListener('load',e=>{
  const d=e.target.contentDocument;
  if(t) d.documentElement.setAttribute('data-theme',t);
});
</script></body></html>
