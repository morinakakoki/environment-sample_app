<title id="appTitle">データ基盤 復習クイズ</title>
<style id="appStyle">
/* ============================================================
   デザイントークン（ライト）
   ============================================================ */
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --card-2:#f8fafc;
  --fg:#16191d;
  --fg-soft:#3c454f;
  --muted:#68727e;
  --line:#e1e6ec;
  --line-strong:#cbd3dd;
  --accent:#1a66d6;
  --accent-fg:#ffffff;
  --accent-soft:#e8f0fd;
  --ok:#12704a;
  --ok-bg:#e4f4ec;
  --ok-line:#9ed3ba;
  --ng:#b3261e;
  --ng-bg:#fdeceb;
  --ng-line:#f0b1ad;
  --warn:#8a5a00;
  --warn-bg:#fdf4e3;
  --warn-line:#e8cf9a;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.07);
  --r:14px;
  --r-sm:10px;
  --tap:48px;
}
/* システム設定がダークのとき（手動でライト指定していなければ） */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318;
    --card:#171d24;
    --card-2:#1d242c;
    --fg:#eef2f6;
    --fg-soft:#c9d2dc;
    --muted:#95a1ae;
    --line:#2a333d;
    --line-strong:#3a4551;
    --accent:#6aa6ff;
    --accent-fg:#0b0f14;
    --accent-soft:#1a2634;
    --ok:#65d6a3;
    --ok-bg:#12291f;
    --ok-line:#2c5c45;
    --ng:#ff9a92;
    --ng-bg:#2c1715;
    --ng-line:#61302c;
    --warn:#e8bf72;
    --warn-bg:#2a2113;
    --warn-line:#5a4826;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
/* 手動でダーク指定したとき（システム設定より優先） */
:root[data-theme="dark"]{
  --bg:#0f1318;
  --card:#171d24;
  --card-2:#1d242c;
  --fg:#eef2f6;
  --fg-soft:#c9d2dc;
  --muted:#95a1ae;
  --line:#2a333d;
  --line-strong:#3a4551;
  --accent:#6aa6ff;
  --accent-fg:#0b0f14;
  --accent-soft:#1a2634;
  --ok:#65d6a3;
  --ok-bg:#12291f;
  --ok-line:#2c5c45;
  --ng:#ff9a92;
  --ng-bg:#2c1715;
  --ng-line:#61302c;
  --warn:#e8bf72;
  --warn-bg:#2a2113;
  --warn-line:#5a4826;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:anywhere;
  word-break:normal;
  line-break:strict;
}
button{font:inherit;color:inherit}
h1,h2,h3{line-height:1.4;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================================================
   レイアウト（375px 優先 / 中央寄せ）
   ============================================================ */
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:0 14px calc(28px + env(safe-area-inset-bottom));
}
.appbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  -webkit-backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
}
@supports not (backdrop-filter:blur(1px)){ .appbar{background:var(--bg)} }
.appbar-in{
  max-width:560px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.brand{font-size:15px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.iconbtn{
  flex:none;width:40px;height:40px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1;
  box-shadow:var(--shadow-sm);
}
.iconbtn:active{transform:translateY(1px)}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:16px;
  margin-top:14px;
}
.card h2{font-size:14px;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:12px}
.hidden{display:none !important}

/* ============================================================
   ボタン
   ============================================================ */
.btn{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:var(--tap);
  padding:12px 14px;
  border-radius:var(--r-sm);
  border:1px solid var(--line-strong);
  background:var(--card);
  text-align:left;cursor:pointer;
  transition:background .12s, border-color .12s, transform .06s;
}
.btn:active{transform:translateY(1px)}
@media (hover:hover){ .btn:hover{background:var(--card-2);border-color:var(--accent)} }
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;justify-content:center}
@media (hover:hover){ .btn-primary:hover{background:var(--accent);filter:brightness(1.08)} }
.btn-ghost{justify-content:center;font-weight:600}
.btn .ico{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:15px}
.btn .bodytxt{flex:1;min-width:0}
.btn .ttl{font-weight:700;font-size:15px;display:block}
.btn .sub{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:1px}
.btn .cnt{
  display:inline-block;margin-top:5px;
  font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--card-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;
}
.btn .cnt:empty{display:none}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}

/* ============================================================
   ホーム：統計
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 6px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.stat.is-ng b{color:var(--ng)}
.stat.is-ok b{color:var(--ok)}

.chaplist{display:flex;flex-direction:column;gap:2px}
.chaprow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.chaprow:first-child{border-top:0}
.chaprow .no{flex:none;font-size:11px;font-weight:700;color:var(--muted);width:34px;font-variant-numeric:tabular-nums}
.chaprow .nm{flex:1;min-width:0;font-size:12.5px;color:var(--fg-soft);line-height:1.45}
.chaprow .pct{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);width:38px;text-align:right}
.meter{flex:none;width:62px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.good i{background:var(--ok)}
.meter.bad i{background:var(--ng)}

/* ============================================================
   クイズ画面
   ============================================================ */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qcount{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
}
.chip.tag{background:transparent;color:var(--muted);border-color:var(--line-strong)}
.chip.method{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.chip.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng-line)}

.qtext{font-size:17.5px;font-weight:700;line-height:1.65;margin:2px 0 14px;letter-spacing:.005em}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;
  min-height:var(--tap);
  padding:12px 13px;
  border:1.5px solid var(--line-strong);
  border-radius:var(--r-sm);
  background:var(--card);
  text-align:left;cursor:pointer;line-height:1.6;font-size:15px;
  transition:border-color .12s, background .12s, transform .06s;
}
.opt:active{transform:translateY(1px)}
@media (hover:hover){ .opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)} }
.opt .key{
  flex:none;width:25px;height:25px;border-radius:8px;
  background:var(--card-2);border:1px solid var(--line-strong);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);
  margin-top:1px;
}
.opt .txt{flex:1;min-width:0}
.opt .mark{flex:none;font-size:15px;font-weight:800;margin-top:1px;opacity:0}
.opt:disabled{cursor:default;opacity:1}
.opt.is-correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.is-correct .key{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.is-correct .mark{opacity:1;color:var(--ok)}
.opt.is-wrong{border-color:var(--ng-line);background:var(--ng-bg)}
.opt.is-wrong .key{background:var(--ng);border-color:var(--ng);color:var(--card)}
.opt.is-wrong .mark{opacity:1;color:var(--ng)}
.opt.is-dim{opacity:.5}

.verdict{
  margin-top:14px;padding:13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card-2);
}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.verdict.ng{background:var(--ng-bg);border-color:var(--ng-line)}
.verdict .vtop{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.verdict.ok .vtop{color:var(--ok)}
.verdict.ng .vtop{color:var(--ng)}
.verdict .exp{font-size:14.5px;line-height:1.75;color:var(--fg-soft)}
.backto{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);
  font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}

/* ============================================================
   結果画面
   ============================================================ */
.score{text-align:center;padding:6px 0 2px}
.score .big{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .big em{font-style:normal;font-size:22px;color:var(--muted);font-weight:700}
.score .pct{font-size:14px;color:var(--muted);margin-top:2px}
.score .msg{margin-top:10px;font-size:14.5px;font-weight:700}

.backchap{
  margin-top:14px;padding:13px;
  border-radius:var(--r-sm);border:1px solid var(--warn-line);background:var(--warn-bg);
}
.backchap .lbl{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--warn);margin-bottom:7px}
.backchap ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.backchap li{font-size:14px;line-height:1.6}
.backchap .cn{font-weight:800;display:block}
.backchap .tg{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.revlist{display:flex;flex-direction:column;gap:11px}
.rev{border:1px solid var(--line);border-left:3px solid var(--ng);border-radius:var(--r-sm);padding:11px 12px;background:var(--card-2)}
.rev .rq{font-size:14.5px;font-weight:700;line-height:1.6;margin-bottom:7px}
.rev .ans{font-size:13.5px;line-height:1.65}
.rev .ans .l{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;display:block}
.rev .ans .you{color:var(--ng)}
.rev .ans .cor{color:var(--ok);font-weight:700}
.rev .rexp{font-size:13px;color:var(--fg-soft);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-strong)}

.hist{display:flex;flex-direction:column;gap:1px}
.histrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);color:var(--fg-soft)}
.histrow:first-child{border-top:0}
.histrow .hw{flex:none;color:var(--muted);font-size:11.5px;width:78px;font-variant-numeric:tabular-nums}
.histrow .hm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histrow .hs{flex:none;font-weight:700;font-variant-numeric:tabular-nums}

/* ============================================================
   その他
   ============================================================ */
.notice{
  margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);
  font-size:12.5px;line-height:1.65;
}
.notice b{color:var(--warn)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 8px;line-height:1.8}

/* 説明モード */
.modesw{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;margin:0 0 13px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card-2);cursor:pointer}
.modesw input{position:absolute;opacity:0;width:0;height:0}
.modesw .sw{flex:none;width:40px;height:23px;border-radius:999px;background:var(--line-strong);
  position:relative;transition:background .15s;margin-top:1px}
.modesw .sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;
  border-radius:50%;background:#fff;transition:transform .15s;box-shadow:var(--shadow-sm)}
.modesw input:checked + .sw{background:var(--accent)}
.modesw input:checked + .sw::after{transform:translateX(17px)}
.modesw input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.modesw .swtxt{font-size:12.5px;line-height:1.65;color:var(--muted)}
.modesw .swtxt b{display:block;font-size:14px;color:var(--fg);margin-bottom:2px}
.exhint{font-size:13px;color:var(--fg-soft);line-height:1.75;margin:14px 0 11px;text-align:center}
.selfrow{display:flex;gap:9px}
.selfrow .btn{flex:1;justify-content:center;text-align:center}

/* 学習の記録 */
.chartbox{width:100%;overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}
.lgd i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;
  vertical-align:middle;margin-right:5px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .mn{flex:none;width:96px;font-size:12.5px;color:var(--fg-soft);line-height:1.45}
.mrow .msp{flex:1;min-width:0}
.mrow .msp svg{display:block;width:100%;height:auto}
.mrow .mv{flex:none;width:56px;text-align:right;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums}
.mrow .mv small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
code,kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--card-2);border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;font-size:.88em;
}
.err pre{
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px;overflow-x:auto;font-size:12.5px;margin:9px 0;line-height:1.6;
}
.err h2{color:var(--ng)}
.filepick{margin-top:12px;font-size:13px}
.filepick input{display:block;margin-top:7px;font-size:13px;max-width:100%}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 出典 */
.srcline{
  margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  font-size:12px;line-height:1.6;
}
.srcline .lbl{
  flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:1px 7px;
}
.srcline a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
@media (hover:hover){ .srcline a:hover{text-decoration-thickness:2px} }

/* Notion の読み込み状況 */
.notionline{
  margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card-2);
  font-size:12.5px;line-height:1.65;
  display:flex;flex-direction:column;gap:2px;
}
.notionline b{font-weight:700}
.notionline.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.notionline.ok b{color:var(--ok)}
.notionline.ng{background:var(--warn-bg);border-color:var(--warn-line)}
.notionline.ng b{color:var(--warn)}
.notionline .muted{font-size:11.5px}

/* 問題を追加する画面 */
.ta{
  width:100%;min-height:190px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
  padding:11px;border-radius:var(--r-sm);
  border:1px solid var(--line-strong);background:var(--card-2);color:var(--fg);
}
.ta::placeholder{color:var(--muted);opacity:.8}
.result{margin-top:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card-2);font-size:13.5px;line-height:1.7}
.result.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.result.ng{background:var(--ng-bg);border-color:var(--ng-line)}
.result b{display:block;margin-bottom:5px}
.result.ok b{color:var(--ok)}
.result.ng b{color:var(--ng)}
.result ul{margin:6px 0 0;padding:0 0 0 18px}
.result li{margin:2px 0}
.steps{margin:0;padding:0 0 0 20px;font-size:13px;line-height:1.85;color:var(--fg-soft)}
.steps li{margin:0 0 4px}
.steps code{font-size:.85em}

@media (max-width:359px){
  body{font-size:15px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
<script type="application/json" id="quizData">[{"id":1,"chapter":1,"tag":"#1","q":"GCP の「プロジェクト」が単位になるものとして正しい組み合わせは？","options":["リージョン・VPC・請求先","API 有効化・課金・IAM","ユーザー・組織・フォルダ","データセット・テーブル・ジョブ"],"answer":1,"explanation":"プロジェクトは API を有効化する単位、課金の単位、IAM の単位。AWS アカウントに近いが1人で何個でも作れる。","addedAt":"2026-08-30","source":"https://cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy","method":"構成・前提"},{"id":2,"chapter":1,"tag":"#2","q":"請求先アカウントとプロジェクトの関係で正しいのは？","options":["請求先アカウントはプロジェクトの親にあたり、IAM もそこから継承される","1つのプロジェクトに複数の請求先アカウントを紐づけて用途別に分けられる","1つの請求先に複数のプロジェクトを付けられ、IAM は継承しない","請求先アカウントを削除すると、紐づくプロジェクトもまとめて削除される"],"answer":2,"explanation":"請求先は「財布」。プロジェクトの親ではなく IAM は継承しない。1財布に多数プロジェクトが定石。","addedAt":"2026-08-30","source":"https://cloud.google.com/billing/docs/how-to/billing-access","method":"構成・前提"},{"id":3,"chapter":1,"tag":"#8","q":"新規プロジェクトで Cloud Run Job を作ろうとしたら API が無効というエラー。AWS には無いこの概念は？","options":["リージョン有効化（使うリージョンをプロジェクト単位で開放する）","API 有効化（サービスをプロジェクト単位でオンにする）","サービスクォータ（上限を上げるまで新しいサービスは作れない）","組織ポリシー（組織に属さない個人プロジェクトでも既定で拒否される）"],"answer":1,"explanation":"GCP は使うサービスをプロジェクトごとに有効化する。Terraform では google_project_service。BigQuery 系は新規で自動有効。","addedAt":"2026-08-30","source":"https://cloud.google.com/service-usage/docs/enable-disable","method":"構成・前提"},{"id":4,"chapter":1,"tag":"#17","q":"Cloud Run Job から BigQuery に書くための権限設計として最小権限に最も近いのは？","options":["Compute Engine の default サービスアカウントをそのまま使い、既定で付く編集者権限に任せる","本人アカウントのサービスアカウントキー(JSON)をイメージに同梱して認証する","専用 SA を作り bigquery.dataEditor と jobUser だけ付けて Job にアタッチ","専用サービスアカウントを作り、確実に動くよう roles/owner を付けておく"],"answer":2,"explanation":"専用 SA・必要ロールだけ・キーは作らずアタッチ、が定石。dataEditor=書く、jobUser=ジョブを投げる。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/batch-loading-data","method":"認証・権限方式"},{"id":5,"chapter":1,"tag":"#17","q":"Scheduler 用 SA を Job 用 SA と分けた理由として正しいのは？","options":["Cloud Scheduler は他とサービスアカウントを共有できない仕様だから","起動する側にデータを書く権限は不要だから（最小権限）","サービスアカウントは1リソースにつき1つしか付けられないから","課金をサービスアカウント単位で分けて集計するため"],"answer":1,"explanation":"起動役に必要なのは run.invoker だけ。書き込み権限を持たせない＝侵害時の影響範囲を狭める。","addedAt":"2026-08-30","source":"https://cloud.google.com/blog/products/identity-security/securing-cloud-run-deployments-with-least-privilege-access/","method":"認証・権限方式"},{"id":6,"chapter":1,"tag":"#12","q":"無料トライアル終了（11/16）で起きることとして正しいのは？","options":["何も起きない。無料枠の範囲で今までどおり動き続ける","ワークロードが停止する。有料化すれば無料枠は継続する","プロジェクトが即座に削除され、データも復元できなくなる","課金が自動的に始まり、上限なく請求が発生するようになる"],"answer":1,"explanation":"トライアル終了でワークロード停止（公式FAQ）。有料アカウント化で復旧し、BigQuery の無料枠は残る。だから 11/1 に有料化する。","addedAt":"2026-08-30","source":"https://cloud.google.com/signup-faqs","method":"コスト方式"},{"id":7,"chapter":2,"tag":"#3","q":"BigQuery のデータセットについて正しいのは？","options":["リージョンは後から変更できる","異なるリージョンのテーブル同士も JOIN できる","リージョンは作成時に固定され、後から変更できない","データセットにリージョンという概念は無い"],"answer":2,"explanation":"データセットはリージョンを持ち、作成後に変更不可。別リージョン間の JOIN は不可。全部 asia-northeast1 に揃える理由。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/datasets","method":"データ方式"},{"id":8,"chapter":2,"tag":"#6","q":"BigQuery の「ジョブ」に含まれないものは？","options":["データのロード","クエリの実行","エクスポート","データセット作成"],"answer":3,"explanation":"ジョブは load / query / extract / copy の4種。履歴は「ジョブ履歴」に6か月残る。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/managing-jobs","method":"データ方式"},{"id":9,"chapter":2,"tag":"#7","q":"日次の取得ジョブ（load_table_from_dataframe）に maximum_bytes_billed を設定しても意味が無い理由は？","options":["ロードジョブには課金バイトが無い（無料）から","BigQuery Studio からしか設定できない仕様だから","Python クライアントが上限設定に対応していないから","無料トライアル中は上限設定そのものが使えないから"],"answer":0,"explanation":"課金バイトが付くのはクエリジョブだけ。上限は staging / mart を作るクエリと dbt profile に置く。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/pricing","method":"コスト方式"},{"id":10,"chapter":2,"tag":"#7","q":"maximum_bytes_billed の判定タイミングは？","options":["クエリの完了後に実績の課金バイトで判定し、超えていれば結果を破棄する","実行前の見積もり（dry run 相当）と比較し、超えていれば実行しない","1時間ごとの集計バッチで判定し、超えた分は翌日に繰り越す","月次の課金締め日にまとめて判定し、超過分だけ請求される"],"answer":1,"explanation":"実行前の見積もりで拒否する。だからコスト防御として唯一「確実」な層。キャッシュヒットは0バイト。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/best-practices-costs","method":"コスト方式"},{"id":11,"chapter":2,"tag":"#7","q":"同じクエリを2回流したら2回目の課金バイトが 0 だった。理由は？","options":["2回目は無料枠が適用された","クエリ結果キャッシュに当たった","パーティションが効いた","BigQuery の不具合"],"answer":1,"explanation":"結果キャッシュヒットは課金 0。上限のテストをする時は --nouse_cache を付ける。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/cached-results","method":"コスト方式"},{"id":12,"chapter":2,"tag":"#20","q":"date 列でパーティションしたテーブルに対して、課金バイトが減らないクエリは？","options":["WHERE date >= '2026-08-01'","WHERE date BETWEEN '2026-08-01' AND '2026-08-31'","WHERE CAST(date AS STRING) LIKE '2026-08%'","WHERE date = CURRENT_DATE()"],"answer":2,"explanation":"パーティション列を関数で包んで文字列比較するとプルーニングが効かない。列そのものに条件を付ける。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/querying-partitioned-tables","method":"データ方式"},{"id":13,"chapter":2,"tag":"#20","q":"既存の非パーティションテーブルをパーティション化する時、Terraform plan に出るものは？","options":["~ update in-place（定義だけがその場で書き換わる）","-/+ forces replacement（作り直し）","変更なし（スキーマの変更は plan には出てこない）","+ create のみ（新しいテーブルが追加で作られる）"],"answer":1,"explanation":"パーティション設定は作成時にしか付けられない属性。だから replace。データは消えるので、バックフィルで戻せる時だけ許可する。","addedAt":"2026-08-30","source":"https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/bigquery_table","method":"IaC方式"},{"id":14,"chapter":2,"tag":"#14","q":"日足の取得を WRITE_TRUNCATE にしてよい根拠は？","options":["BigQuery のドキュメントが日次ロードの既定として推奨している設定だから","毎回「直近1年を全量取り直す」設計なので、全部消して入れ直しても結果が同じ（冪等）だから","WRITE_APPEND より書き込みが速く、ロードのコストも下がるから","全量を入れ替えるとパーティションが再構成されて検索が速くなるから"],"answer":1,"explanation":"TRUNCATE が適するのは全量取り直せる時だけ。増分データや分足（60日しか遡れない）では使えない。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/load-data-partitioned-tables","method":"データ方式"},{"id":15,"chapter":2,"tag":"#14","q":"分足（yfinance は直近 60 日しか取れない）のロード方式として適切なのは？","options":["テーブル全体を WRITE_TRUNCATE して、毎日60日分を入れ直す","WRITE_APPEND で毎日追記し、重複は後から DELETE で消す","日付パーティション（table$YYYYMMDD）を指定して、その日だけ置き換える","毎回テーブルを DROP して CREATE し直し、60日分を入れる"],"answer":2,"explanation":"全量が取り直せないので全体 TRUNCATE は不可。APPEND は再実行で重複。パーティション単位の置換なら冪等。","addedAt":"2026-08-30","source":"https://cloud.google.com/bigquery/docs/load-data-partitioned-tables","method":"データ方式"},{"id":16,"chapter":2,"tag":"#15","q":"terraform plan が daily_prices の replace を提案した。直接原因は？","options":["Terraform provider のバージョンが上がり、テーブル定義の既定値が変わったから","Python がロードのたびにスキーマを autodetect してテーブル定義を上書きし、宣言とズレた","BigQuery 側の定期メンテナンスでテーブルのメタデータが作り直されたから","データセットのリージョン設定が変わり、テーブルの作り直しが必要になったから"],"answer":1,"explanation":"LoadJobConfig に schema を渡さないと毎回 DataFrame から推定→REQUIRED→NULLABLE 等にドリフト。対策は schema 明示。「構造は Terraform、中身は Python」。","addedAt":"2026-08-30","source":"https://cloud.google.com/python/docs/reference/bigquery/latest/google.cloud.bigquery.client.Client","method":"IaC方式"},{"id":17,"chapter":3,"tag":"#16","q":"Cloud Run の Service と Job の違いで正しいのは？","options":["Service はバッチ処理向けで、Job は HTTP を受けて常駐し続ける","Service は常駐して HTTP を受ける。Job は起動して処理し終了する","どちらも常駐する仕組みで、課金の単位と名前だけが違う","Job は Docker イメージを使えず、ソースを直接デプロイする"],"answer":1,"explanation":"バッチは Job。AWS でいえば ECS Fargate の RunTask。定義（イメージ・SA）と実行（execution）が分かれる。","addedAt":"2026-08-30","source":"https://cloud.google.com/run/docs/create-jobs","method":"処理方式"},{"id":18,"chapter":3,"tag":"#16","q":"イメージを修正して push したが Job の動作が変わらない。最も考えられる原因は？","options":["Artifact Registry へ push したイメージの反映に24時間かかるから","Job 定義が古いタグ（v1）を指したまま。タグを更新して定義を apply する必要がある","Cloud Scheduler を再作成しないと新しいイメージが読まれないから","サービスアカウントの権限不足で新しいイメージを pull できていない"],"answer":1,"explanation":"Job 定義はイメージのタグを固定で持つ。v2 に上げて Terraform で定義を更新する。","addedAt":"2026-08-30","source":"https://cloud.google.com/run/docs/create-jobs","method":"処理方式"},{"id":19,"chapter":3,"tag":"#18","q":"Cloud Scheduler から Cloud Run Job を起動する時、OAuth トークンを使う理由は？","options":["OAuth の方が OIDC より暗号強度が高く、安全とされているから","呼び先が Google API（run.googleapis.com）のため。自前エンドポイントなら OIDC を使う","Cloud Scheduler の HTTP ターゲットは OAuth にしか対応しておらず、OIDC は選べない仕様だから","OIDC は自前サーバ向けの規格で、Google API の呼び出しには使えないから"],"answer":1,"explanation":"Google API を呼ぶ＝OAuth、自前エンドポイント＝OIDC。SA に対象 Job の run.invoker が要る。","addedAt":"2026-08-30","source":"https://cloud.google.com/scheduler/docs/http-target-auth","method":"認証・権限方式"},{"id":20,"chapter":3,"tag":"#18","q":"Scheduler の実行結果が 403。最初に疑うのは？","options":["cron の書式が誤っていて、そもそも起動時刻が来ていない","Scheduler 用 SA に対象 Job の run.invoker が付いていない","リクエスト URI に指定したリージョンが Job の実際のリージョンと違っている","タイムゾーンの指定が UTC のままで、実行時刻がずれている"],"answer":1,"explanation":"403＝権限。gcloud run jobs get-iam-policy で binding を確認。404 なら URI（プロジェクト・リージョン・Job 名）。","addedAt":"2026-08-30","source":"https://cloud.google.com/scheduler/docs/troubleshooting","method":"認証・権限方式"},{"id":21,"chapter":3,"tag":"#16","q":"Dockerfile で requirements.txt を先に COPY してから pip install し、その後にコードを COPY する理由は？","options":["Python の仕様で COPY と pip install の順番が決まっているから","コードだけ変えた時に pip install のレイヤーキャッシュが効き、ビルドが速いから","先に依存だけ入れることで、脆弱なパッケージを検出しやすいから","この順番にすると最終的なイメージのサイズが小さくなるから"],"answer":1,"explanation":"レイヤーは上から順にキャッシュされる。変更頻度の低いものを先に置く。","addedAt":"2026-08-30","source":"https://docs.docker.com/build/cache/optimize/","method":"処理方式"},{"id":22,"chapter":3,"tag":"#19","q":"FRED の API キーの置き場として適切なのは？","options":["Dockerfile の ENV に書き、イメージに焼き込んで渡す","Terraform の .tf に平文で書き、apply で流し込む","Secret Manager に置き、Job 定義から環境変数として参照する","Git リポジトリの .env に置き、コンテナから読み込む"],"answer":2,"explanation":"イメージ・tfstate・Git に平文を置かない。Job の SA に secretmanager.secretAccessor が要る。","addedAt":"2026-08-30","source":"https://cloud.google.com/run/docs/configuring/jobs/secrets","method":"認証・権限方式"},{"id":23,"chapter":3,"tag":"#16","q":"raw → staging → mart の順序制御を「時刻ずらし」で行う判断の代替案として、定石に近いのは？","options":["Cloud Composer（Airflow）や Workflows で依存関係を書く","3つの処理を全部1つの Job にまとめて順番に実行する","毎日決まった時間に手動で順番に実行して結果を確認する","Cloud Functions を3本並べ、それぞれの時刻をずらして順番に起動する"],"answer":0,"explanation":"依存関係の明示は Composer / Workflows が定石。Composer は個人には課金が重い＝「なぜ使わなかったか」が設計判断メモになる。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/composer/docs/composer-3/write-dags","method":"処理方式"},{"id":24,"chapter":4,"tag":"#9","q":"Terraform と CloudFormation の決定的な違いは？","options":["Terraform は命令型で、手順を上から順に書いていく方式である","Terraform は state を自分で持ち、宣言・state・実体の3つを突き合わせる","CloudFormation には plan にあたる事前確認の仕組みがそもそも存在しない","Terraform は AWS には使えず、他社クラウド専用の道具である"],"answer":1,"explanation":"CloudFormation は状態を AWS が持つ。Terraform は tfstate。チームでは GCS 等に置きロックする。個人はローカル。","addedAt":"2026-08-30","source":"https://developer.hashicorp.com/terraform/language/state/backends","method":"IaC方式"},{"id":25,"chapter":4,"tag":"#9","q":"terraform plan の記号で「作り直し（データ消失の可能性）」を示すのは？","options":["+","~","-/+","="],"answer":2,"explanation":"+ 作成、~ その場で変更、-/+ replace。-/+ か destroy が出たら apply しない、が約束。","addedAt":"2026-08-30","source":"https://developer.hashicorp.com/terraform/tutorials/cli/plan","method":"IaC方式"},{"id":26,"chapter":4,"tag":"#15","q":"「ドリフト」の説明として正しいのは？","options":["Terraform 本体と provider のバージョンがずれていること","Terraform の外から実体が変更され、宣言（.tf）とズレること","state ファイルが破損して読めなくなっている状態のこと","リージョン間の通信でレイテンシが大きくなること"],"answer":1,"explanation":"8/25・8/30 は Python がスキーマを書き換えたドリフト。Terraform は宣言を正として実体を戻そうとし、replace になる。","addedAt":"2026-08-30","source":"https://developer.hashicorp.com/terraform/tutorials/state/resource-drift","method":"IaC方式"},{"id":27,"chapter":4,"tag":"#9","q":"個人ポートフォリオで tfstate をローカルに置く判断を面接で説明する時、添えるべき定石は？","options":["state は常にローカルに置くのが公式の推奨とされている","チームでは GCS などのリモートバックエンドに置き、ロックで同時実行を防ぐのが定石","state は Git にコミットして履歴を残すのが定石とされる","state は Terraform 1.0 以降では不要になり使われない"],"answer":1,"explanation":"「単一端末・個人なのでローカル。本番ならリモート＋ロック」と言える＝代替案と理由。","addedAt":"2026-08-30","source":"https://developer.hashicorp.com/terraform/language/state/locking","method":"IaC方式"},{"id":28,"chapter":5,"tag":"#10","q":"raw 層の定義として最も正確なのは？","options":["自動取得したデータを、整形してから置いておく層","加工前のまま置く、パイプラインでこれ以上遡れない入力の境界","集計済みの数値を BI から参照しやすい形で置く層","処理の途中で出る一時ファイルを一時的に置く層"],"answer":1,"explanation":"手動投入の銘柄マスタも raw。「取得元が何か」ではなく「これ以上遡れないか」で決まる。","addedAt":"2026-08-30","source":"https://claude.ai/code/artifact/39af473a-7ab5-4f68-9d60-561aa254e638","method":"データ方式"},{"id":29,"chapter":5,"tag":"#13","q":"yfinance で auto_adjust=False にした理由は？","options":["auto_adjust=True だと取得に時間がかかりすぎ、日次のジョブ実行時間に間に合わないから","調整済み値が raw に入ると『調整後終値を自分で再計算する』見せ場が成立せず、raw 原則にも反するから","yfinance の既定値が False で、変えると警告が出る仕様だから","Terraform 側のスキーマ定義と列名を合わせる必要があるから"],"answer":1,"explanation":"download() は 0.2.51 でデフォルトが True になり（0.2.53 以降は未指定だと警告つきで実質 True）、OHLC が調整済みに書き換わり Adj Close 列が消える。Ticker.history() は 0.1.26 から既定 True。raw は加工前のまま。","addedAt":"2026-08-30","source":"https://ranaroussi.github.io/yfinance/reference/api/yfinance.download.html","method":"データ方式"},{"id":30,"chapter":5,"tag":"#11","q":"失敗したジョブを「再実行してよい」と判断できる条件は？","options":["エラーメッセージが短くて読みやすく、原因がその場で特定できること","前回の実行から24時間以上が経過していること","処理が冪等（2回流しても結果が同じ）で、途中まで書かれた状態が残らない","運用担当者から再実行の承認が取れていること"],"answer":2,"explanation":"TRUNCATE・パーティション置換・CREATE OR REPLACE は冪等。APPEND は重複するので不可。DATUM Ops の『再実行判断』の中身。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/bigquery/docs/batch-loading-data","method":"運用・監視方式"},{"id":31,"chapter":5,"tag":"as-of","q":"四半期決算を日次価格に結合する時、fiscal_period_end（期末日）ではなく filed_date（提出日）で結ぶ理由は？","options":["期末日は欠損が多く、結合できない銘柄が出てしまうから","期末日で結ぶと、まだ公開されていない情報を過去の日に付けてしまう（ルックアヘッド）から","提出日で結んだ方がパーティションとインデックスが効き、JOIN が速く終わるから","SEC の開示仕様では期末日そのものが取得できないから"],"answer":1,"explanation":"as-of ジョイン＝その日時点で知り得た最新値。filed_date \u003c= date で絞り最新1件を QUALIFY で取る。","addedAt":"2026-08-30","source":"https://claude.ai/code/artifact/39af473a-7ab5-4f68-9d60-561aa254e638","method":"データ方式"},{"id":32,"chapter":5,"tag":"品質","q":"合成データではなく実データを使う理由として本ポートフォリオが挙げたのは？","options":["合成データは生成に時間がかかり、日次実行に載らないから","合成データだと品質テストが自作自演になり、検証可能性を示せない","実データの方が量が多く、BigQuery の練習になるから","BigQuery の利用規約が合成データの投入を禁じているから"],"answer":1,"explanation":"実データには本物の欠損（外国籍の us-gaap 欠落、FRED の \".\"、Yahoo との不一致）がある。検知して落とさず記録する。","addedAt":"2026-08-30","source":"https://claude.ai/code/artifact/39af473a-7ab5-4f68-9d60-561aa254e638","method":"データ方式"},{"id":33,"chapter":5,"tag":"#11","q":"「今日のデータが来ていない」を検知する仕組みとして、失敗通知の経路に自然に乗る方法は？","options":["毎朝 BigQuery Studio で手動の SELECT を流し、件数と最新日付を目で見て確認する","mart ジョブの最後に ASSERT MAX(date) >= … を置き、満たさなければジョブを失敗させる","Looker Studio のダッシュボードを開いて欠けを目で確認する","課金額が下がったことに予算アラート経由で間接的に気づく"],"answer":1,"explanation":"鮮度・品質は ASSERT でジョブ失敗に変換すると、失敗アラートと同じ通知経路で届く。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/debugging-statements","method":"運用・監視方式"},{"id":34,"chapter":6,"tag":"#7","q":"予算アラート（月3,000円）について正しいのは？","options":["超えたらクエリの実行が自動的に止まる","超えたら通知が来るだけで課金は止まらない","超えたらプロジェクト全体が一時停止される","超えたら翌月の無料枠が自動的に増える"],"answer":1,"explanation":"予算アラートは通知だけで、課金も利用も止まりません（公式に「アラートのみの予算は使用量や支出を自動的に上限設定しない」と明記）。確実に止めたいなら、クエリ単位の maximum_bytes_billed（実行前に拒否）と、有料化後のカスタム割り当てを使います。なお近年、超過時にサービスを自動停止する「支出上限（spend cap）予算」がプレビュー提供されていますが、対象は Cloud Run や Gemini API などで BigQuery は含まれません。BigQuery のクエリ課金を止める役には立ちません。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/billing/docs/how-to/budgets","method":"コスト方式"},{"id":35,"chapter":6,"tag":"#12","q":"有料化（11/1）の直後に必ずやることは？","options":["データセットのリージョンを東京に作り直して寄せる","BigQuery のカスタム割り当て（1日の課金バイト上限）を設定する","サービスアカウントを作り直して権限を付け直す","Cloud Scheduler を再作成して cron を設定し直す"],"answer":1,"explanation":"トライアル中は「$300 で停止」が実質ハードリミット。有料化でそれが外れるので、カスタム割り当てで代替する（トライアル中は Adjustable=No）。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/bigquery/docs/custom-quotas","method":"コスト方式"},{"id":36,"chapter":6,"tag":"#7","q":"コスト防御3層のうち「実行前に確実に止まる」のは？","options":["予算アラート（Cloud Billing の budget 設定）","カスタム割り当て（BigQuery の custom quota）","maximum_bytes_billed（クエリ側のオプション）","Looker Studio の閲覧制限（レポートの共有設定）"],"answer":2,"explanation":"クエリ単位の maximum_bytes_billed だけが、実行前の見積もりで上限を超えると拒否します。カスタム割り当ては公式に「おおよその値」とされ、割り当てを超えるクエリがまれに実行されることがあります。予算アラートは通知のみで止まりません。「確実に止まるか」で3つを区別するのがポイントです。","addedAt":"2026-08-30","source":"https://docs.cloud.google.com/bigquery/docs/custom-quotas","method":"コスト方式"},{"id":37,"chapter":7,"tag":"設計","q":"「なぜ Airflow / Cloud Composer を使わなかったか」への答えとして一貫しているのは？","options":["Airflow は学習コストが高いので今回は見送った。ジョブが3本なら手で順番を決めれば足りる。必要になったら勉強して入れる","Composer は常駐課金が重く無料枠で回らない。ジョブ3本の順序は時刻ずらしで足りる。依存が複雑になれば Workflows / Composer に移す","Airflow は GCP では動かず AWS 専用の仕組み。GCP で組むなら Cloud Run しか選択肢が無い。だから採用しなかった","Composer は新しすぎて日本語の情報が少ない。Cloud Run の方が枯れていて安心できる。実務でも Composer は避けられる傾向にある"],"answer":1,"explanation":"採らなかった選択肢＋理由＋採った案の弱点＋実務ならどう変えるか、の4点が言えれば合格。","addedAt":"2026-08-30","source":"https://cloud.google.com/composer/pricing","method":"設計判断"},{"id":38,"chapter":7,"tag":"設計","q":"dbt を mart 層だけに入れた判断の説明として筋が通るのは？","options":["dbt は raw 層には対応しておらず、ロード直後の生データには使えない仕様になっている。結果として使える層が mart しか無かったので、そこだけに入れることにした","raw は Python のロード、staging は素の SQL で十分。変換ロジックが集中し、テスト（not_null/unique/一致率）が効くのは mart だから","dbt は無料枠の対象外で、層を増やすほど課金が膨らむ。mart だけなら実行回数が少なく収まる。コストを抑えるための判断だった","staging 層はこの構成には存在せず、raw から直接 mart を作っている。したがって dbt を入れられる層が mart しか無かった"],"answer":1,"explanation":"dbt の価値は ref による依存管理とテスト。価値が出る層に絞る＝Be Lazy。","addedAt":"2026-08-30","source":"https://claude.ai/code/artifact/39af473a-7ab5-4f68-9d60-561aa254e638","method":"設計判断"},{"id":39,"chapter":5,"tag":"#11","method":"運用・監視方式","q":"ジョブ失敗の通知をログベースのアラートで組んだ。運用上、知っておくべき制限はどれか。","options":["severity が ERROR のログにはアラートを設定できない","1つのログベースアラートポリシーにつき、通知は1日20件までに制限される","通知先はメールしか選べず、Slack や Webhook は使えない","Cloud Run のログはログベースアラートの対象外"],"answer":1,"explanation":"ログベースのアラートポリシーには「1ポリシーあたり1日20インシデント」の上限があり、超えると通知が止まります。ジョブが壊れて大量にエラーを吐いたときに、まさに知りたい場面で通知が来なくなり得るということです。通知先はメール以外の複数チャネルを設定でき、Cloud Run のログも対象にできるので、他の記述は誤りです。","source":"https://docs.cloud.google.com/logging/docs/alerting/log-based-alerts","addedAt":"2026-08-31"},{"id":40,"chapter":5,"tag":"#11","method":"運用・監視方式","q":"監視を組んだあとに「意図的に失敗させて検知を確かめる」ことの意味は。","options":["ジョブの実行時間を計測して性能を把握するため","ログの保存容量が上限に達しないか確認するため","処理が冪等かどうかを実際に流して検証するため","通知経路が実際に鳴ることは、鳴らしてみるまで分からないから"],"answer":3,"explanation":"アラートは「設定した」ことと「届く」ことが別物です。フィルタ条件のズレ、通知チャネルの未確認、権限不足のいずれかで黙ることがあり、鳴らない監視は無いのと同じです。ログベースのアラートは、条件に合うログエントリを手で書き込んでテストできます。冪等性の確認は再実行して結果が変わらないかを見る別の作業です。","source":"https://docs.cloud.google.com/logging/docs/alerting/log-based-alerts","addedAt":"2026-08-31"},{"id":41,"chapter":6,"tag":"#7","method":"運用・監視方式","q":"予算アラートとは別に、INFORMATION_SCHEMA.JOBS の課金バイトを自分の mart に保存する狙いは。","options":["ジョブ単位の課金バイトを日次で追え、どのクエリが重いかまで特定できるから","予算アラートより早いタイミングで通知が届くようになるから","保存しないと INFORMATION_SCHEMA が使えなくなるから","保存しておくと上限を超えたときに課金を自動で止められるから"],"answer":0,"explanation":"予算アラートはプロジェクト全体の金額しか教えず、どのクエリが原因かは分かりません。INFORMATION_SCHEMA.JOBS には total_bytes_billed がジョブ単位で入るので犯人を特定できます。ただしこのビューの履歴は180日で消えるため、長期の推移を見たいなら自分のテーブルに残す必要があります。保存しても課金は止まらず、通知が早くなるわけでもありません（このビューへのクエリにはリージョン修飾子が要る点にも注意）。","source":"https://docs.cloud.google.com/bigquery/docs/information-schema-jobs","addedAt":"2026-08-31"},{"id":42,"chapter":4,"tag":"#15","method":"設計判断","q":"テーブルのスキーマを「Terraform が正、Python 側は明示指定」にした理由の説明として筋が通るのは。","options":["Terraform の方が扱えるデータ型が多く、細かい指定ができるから","Python のクライアントライブラリではロード時にスキーマを明示指定できない仕様だから","autodetect に任せると毎回定義が上書きされてドリフトし、replace 事故になるから","autodetect を使うとスキャン量が増えて追加料金がかかるから"],"answer":2,"explanation":"autodetect はロードのたびにスキーマを推定して書き換えるため、Terraform の宣言と実体がズレます。ズレたまま apply すると差分が replace（テーブル作り直し）として出て、実際に事故になりました。弱点は列を足すとき .tf と Python の両方を直す必要があること。「スキーマの所有者を1つに決める」という判断そのものが説明材料になります。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":43,"chapter":7,"tag":"設計","method":"設計判断","q":"DWH に BigQuery を選び、Redshift Serverless を採らなかった説明として一貫しているのは。","options":["Redshift Serverless には東京リージョンが無いため、日本から使うと通信の遅延が大きいから","BigQuery は月1TiB・10GiB が恒久無料で面接時も動かせる。Redshift の無料枠は期限付きだから","BigQuery の方が新しいサービスで、機能が多く将来性もあるから","Redshift では標準 SQL が使えず、独自の方言を覚える必要があるから"],"answer":1,"explanation":"ポートフォリオは作って終わりではなく、面接の場で動かせる必要があります。恒久無料枠のある BigQuery なら数か月後も見せられますが、期限付きトライアルは切れたら止まります。求人で BigQuery 必須が多い点も理由になります。弱点は AWS 実務との接続が薄く見えることで、そこは経歴書側で CloudFormation を語って補う——採用理由と弱点の両方が言えることが大事です。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":44,"chapter":7,"tag":"設計","method":"設計判断","q":"Snowflake を全再現せず「1テーブル＋スクリーンショットの縮小版」にした判断の説明として筋が通るのは。","options":["無料トライアルに期限が無いので急いで作る必要がないから","Snowflake は BigQuery とほぼ同じなので再現する意味が無いから","Snowflake は法人契約が必要で、個人では契約そのものができないから","トライアルが30日で切れ面接時に見せられないため、差分を語れる最小限に絞った"],"answer":3,"explanation":"見せられなくなるものを作り込んでも面接では機能しません。BigQuery との違い（仮想ウェアハウスやゼロコピークローンなど）を自分の言葉で語れれば目的は果たせる、という割り切りです。弱点は「Snowflake の実務相当とは言えない」ことで、そこは認めた上での判断になります。期限のある無料枠にどこまで投資するかの判断例としても使えます。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":45,"chapter":1,"tag":"#17","method":"構成・前提","q":"scheduler-invoker サービスアカウントの権限が外れたら、何が起きるか。","options":["BigQuery のテーブルが読めなくなり、クエリが全部失敗する","Job は起動されなくなるが、データ・Job 定義・イメージは無傷のまま残る","Artifact Registry のイメージが削除される","Terraform の state が壊れて apply できなくなる"],"answer":1,"explanation":"scheduler-invoker は run.invoker だけを持つ「起動役」で、データには一切触れません。権限が外れると Scheduler から Job を叩けず 403 になり日次の取り込みが止まりますが、BigQuery のテーブルもイメージも state も無事です。役割ごとに SA を分けてあると、壊れたときの影響範囲をここまで狭く言い切れます。これが最小権限の実利です。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":46,"chapter":4,"tag":"#9","method":"構成・前提","q":"このポートフォリオで Terraform の管理範囲に「入っていない」ものはどれか。","options":["BigQuery のデータセットとテーブル定義（スキーマ・パーティション）","Cloud Run Job と Cloud Scheduler の定義","サービスアカウントと IAM バインディング","staging / mart の SQL 本体とテーブルの中身"],"answer":3,"explanation":"Terraform は「入れ物」を持ち「中身」は持たない、という線引きです。データセット・テーブル定義・Job・Scheduler・SA と IAM は Terraform 管理下ですが、SQL 本体、テーブルの中身、イメージの中身は管理外。プロジェクト作成・請求先・予算アラートも手動側です。この線が引けていると「なぜこれは .tf に無いのか」に即答できます。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":47,"chapter":7,"tag":"設計","method":"構成・前提","q":"日足の取り込みについて「そこが止まると全部止まる」箇所はどれか。","options":["Cloud Scheduler（起動されなければ Job が走らない）","Looker Studio（表示が止まると取り込みも止まる）","mart データセット（無いと raw への書き込みが失敗する）","Secret Manager（日足の取得にも FRED のキーが要る）"],"answer":0,"explanation":"日足は Scheduler → Cloud Run Job → BigQuery raw の一本道なので、起点である Scheduler が止まれば何も始まりません。Looker Studio は下流の閲覧なので落ちても取り込みは続き、mart も raw より下流なので raw への書き込みには関係しません。FRED のキーはマクロ指標用で、yfinance の日足には不要です。どこが単一障害点かを言えるのが構成理解です。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"},{"id":48,"chapter":1,"tag":"#1","method":"構成・前提","q":"dev / prod を分けず1プロジェクトにした判断の説明として筋が通るのは。","options":["GCP では個人アカウントで複数プロジェクトを作れないから","プロジェクトを分けると BigQuery のデータセットを参照できなくなるから","個人の学習用で検証と本番の区別が無いため。実務では分けて課金と IAM を切るのが定石","プロジェクトを分けると Terraform で一括管理できなくなるから"],"answer":2,"explanation":"プロジェクトは API 有効化・課金・IAM の単位なので、実務では dev と prod を分けて事故の波及と権限を切るのが定石です。個人の学習用では分ける相手がいないため1つで足ります。「本番なら分ける」と一言添えられれば、知らないのではなく選んだのだと伝わります。複数プロジェクトは個人でも作れますし、他プロジェクトのデータセットも Terraform も問題なく扱えます。","source":"https://claude.ai/code/artifact/68d8ce3d-c753-4c35-9e96-73d1f6553fff","addedAt":"2026-08-31"}]</script>
<script type="text/plain" id="bodyTpl"><header class="appbar">
  <div class="appbar-in">
    <div class="brand">データ基盤 復習クイズ<small id="brandSub">ポートフォリオ復習用</small></div>
    <button class="iconbtn" id="themeBtn" type="button" title="テーマ切り替え" aria-label="テーマ切り替え">🌓</button>
    <button class="iconbtn hidden" id="homeBtn" type="button" title="ホームに戻る" aria-label="ホームに戻る">✕</button>
  </div>
</header>

<main class="wrap">

  <!-- 読み込み中 -->
  <section id="screenLoading" aria-live="polite">
    <div class="card"><div class="empty">問題データを読み込み中…</div></div>
  </section>

  <!-- 読み込みエラー -->
  <section id="screenError" class="hidden">
    <div class="card err">
      <h2>quiz-data.json を読み込めませんでした</h2>
      <p id="errMsg" class="muted" style="font-size:13.5px"></p>
      <p style="font-size:13.5px">ブラウザで <code>index.html</code> を直接開く（<code>file://</code>）と、セキュリティ制限で <code>fetch</code> が失敗します。<b>このフォルダでローカルサーバを立てて</b>ください。</p>
      <pre>cd quiz
python3 -m http.server 8000
# → http://localhost:8000 を開く</pre>
      <p style="font-size:13.5px" class="muted">Node があるなら <code>npx serve .</code> や <code>npx http-server .</code> でも同じです。</p>
      <div class="filepick">
        <label for="filePick"><b>今すぐ試したいだけなら：</b>quiz-data.json を直接選んで読み込めます（履歴は保存されます）。</label>
        <input type="file" id="filePick" accept=".json,application/json">
      </div>
    </div>
  </section>

  <!-- ホーム -->
  <section id="screenHome" class="hidden">
    <div class="card">
      <h2>これまでの記録</h2>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>総問題数</span></div>
        <div class="stat"><b id="stSeen">0</b><span>挑戦済み</span></div>
        <div class="stat is-ok"><b id="stAcc">–</b><span>正答率</span></div>
        <div class="stat is-ng"><b id="stWrong">0</b><span>要復習</span></div>
      </div>
      <div id="storageWarn" class="notice hidden">
        <b>履歴を保存できません。</b><span id="storageWhy">ブラウザの localStorage が使えない設定（プライベートモード等）のようです。</span>今回の結果はこのタブを閉じるまで有効です。
      </div>
      <div id="dataWarn" class="notice hidden"></div>
      <div id="notionLine" class="notionline hidden"></div>
      <div id="syncLine" class="notionline hidden"></div>
    </div>

    <div class="card">
      <h2>出題モード</h2>
      <label class="modesw" for="explainSw">
        <input type="checkbox" id="explainSw">
        <span class="sw" aria-hidden="true"></span>
        <span class="swtxt">
          <b>説明モードで解く</b>
          <span>選択肢を隠して出題します。声に出して説明してから答えを見て、
                説明できたかを自分で申告します。4択の成績とは別に記録されます。</span>
        </span>
      </label>
      <div style="display:flex;flex-direction:column;gap:9px">
        <button class="btn" id="modeAll" type="button">
          <span class="ico" aria-hidden="true">🎯</span>
          <span class="bodytxt"><span class="ttl">全範囲 10問</span><span class="sub">間違い → そろそろ忘れる頃 → 未挑戦 → 済み の順に出題</span><span class="cnt" id="cntAll"></span></span>
        </button>
        <button class="btn" id="modeWrong" type="button">
          <span class="ico" aria-hidden="true">🔁</span>
          <span class="bodytxt"><span class="ttl">間違いのみ</span><span class="sub">直近で不正解だった問題だけを解き直す</span><span class="cnt" id="cntWrong"></span></span>
        </button>
        <button class="btn" id="modeDue" type="button">
          <span class="ico" aria-hidden="true">⏳</span>
          <span class="bodytxt"><span class="ttl">そろそろ復習</span><span class="sub">正解してから時間が経った問題。正解が続くほど間隔が伸びます</span><span class="cnt" id="cntDue"></span></span>
        </button>
        <button class="btn" id="modeRecent" type="button">
          <span class="ico" aria-hidden="true">🆕</span>
          <span class="bodytxt"><span class="ttl">最近追加された問題</span><span class="sub">addedAt の新しい順に 10問（＝今日の学習分）</span><span class="cnt" id="cntRecent"></span></span>
        </button>
      </div>
    </div>

    <div class="card">
      <h2>方式別に解く</h2>
      <p class="hint" style="text-align:left;margin:-4px 0 12px">
        方式設計書の区分です。<b>新しい方式や機能を作ったら、その方式の問題を足していきます。</b>
        問題数が少ない方式は、まだ言葉にできていないところです。
      </p>
      <div id="methodBtns" style="display:flex;flex-direction:column;gap:9px"></div>
    </div>

    <div class="card">
      <h2>章別に解く</h2>
      <p class="hint" style="text-align:left;margin:-4px 0 12px">基礎知識ノートの章です。</p>
      <div id="chapBtns" style="display:flex;flex-direction:column;gap:9px"></div>
    </div>

    <div class="card">
      <h2>章別の理解度</h2>
      <div class="chaplist" id="chapStats"></div>
      <p class="hint">正答率は「各問の直近の正誤」ベース。未挑戦の問題は分母に入りません。</p>
    </div>

    <div class="card" id="histCard">
      <h2>最近のセッション</h2>
      <div class="hist" id="histList"></div>
      <div style="height:11px"></div>
      <button class="btn btn-ghost" id="progBtn" type="button">学習の記録（推移）を見る</button>
    </div>

    <div class="card">
      <h2>データ</h2>
      <button class="btn" id="addBtn" type="button">
        <span class="ico" aria-hidden="true">＋</span>
        <span class="bodytxt"><span class="ttl">問題を追加</span><span class="sub">Claude が作った JSON を貼り付けて取り込む</span></span>
      </button>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="resetBtn" type="button">学習履歴をリセット</button>
      <p class="hint">問題を追加するときは <code>quiz-data.json</code> に追記するだけ。コードの変更は不要です（README 参照）。</p>
    </div>
  </section>

  <!-- クイズ -->
  <section id="screenQuiz" class="hidden">
    <div class="card">
      <div class="qhead">
        <span class="qcount" id="qCount">1 / 10</span>
        <span class="bar"><i id="qBar" style="width:0%"></i></span>
        <span class="qcount" id="qScore">0問正解</span>
      </div>
      <div class="chips">
        <span class="chip" id="qChapter"></span>
        <span class="chip tag" id="qTag"></span>
        <span class="chip method" id="qMethod"></span>
      </div>
      <h1 class="qtext" id="qText"></h1>
      <div class="opts" id="qOpts" role="group" aria-label="選択肢"></div>
      <div id="qExplainWrap" class="hidden">
        <p class="exhint">頭の中で、あるいは声に出して説明してみてください。<br>
          <b>言えたと思ってから</b>答えを見ます。</p>
        <button class="btn btn-primary" id="revealBtn" type="button">答えを見る</button>
      </div>
      <div id="qVerdict" class="hidden" role="status" aria-live="polite"></div>
      <div id="qSelfWrap" class="hidden" tabindex="-1">
        <p class="exhint" style="margin-top:14px">いまの説明は、この解説と同じことを言えていましたか？</p>
        <div class="selfrow">
          <button class="btn btn-primary" id="selfOkBtn" type="button">説明できた</button>
          <button class="btn btn-ghost" id="selfNgBtn" type="button">できなかった</button>
        </div>
      </div>
      <div id="qNextWrap" class="hidden">
        <button class="btn btn-primary" id="nextBtn" type="button" style="margin-top:12px">次の問題へ</button>
      </div>
      <p class="hint" id="qHint"><kbd>1</kbd>〜<kbd>4</kbd> で解答、<kbd>Enter</kbd> で次へ</p>
    </div>
  </section>

  <!-- 問題を追加 -->
  <section id="screenAdd" class="hidden">
    <div class="card">
      <h2>問題を追加</h2>
      <p style="font-size:13.5px;margin:0 0 10px;line-height:1.75">
        Claude に「<b>データ方式に as-of ジョインを実装した。quiz-data.json 形式で3問作って</b>」
        のように、<b>どの方式に何を足したか</b>を伝えて頼み、返ってきた JSON をそのまま

function hashId(str){
  var h = 5381, i;
  for(i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) | 0; }

function normAnswer(a, options){
  var i, t, n;
  if(typeof a === 'number' && a >= 0 && a < options.length && a === Math.floor(a)) return a;
  if(typeof a === 'string'){
    /* 空欄は先に弾く。あとに置くと、選択肢にも空文字が混じっていたときに
       indexOf('') が一致してしまい、正解未設定の問題が通ってしまう。
       Number('') が 0 になる件もここで防いでいる。 */
    t = a.trim();
    if(t === '') return -1;
    i = options.indexOf(a);
    if(i >= 0) return i;
    if(/^[A-Fa-f]$/.test(t)){
      i = LETTERS.indexOf(t.toUpperCase());
      if(i >= 0 && i < options.length) return i;
    }
    n = Number(t);
    if(!isNaN(n) && n === Math.floor(n)){

function parseData(raw){
  var list = [];
  var chapTitles = {};
  var seen = bare();
  var warnings = [];

  var arr;
  if(Array.isArray(raw)){
    arr = raw;
  }else if(raw && Array.isArray(raw.questions)){
    arr = raw.questions;
    if(raw.chapters && typeof raw.chapters === 'object'){
      for(var k in raw.chapters){

      }
    }
  }else{
    throw new Error('quiz-data.json は配列、または {"chapters":{...},"questions":[...]} である必要があります。');
  }

  for(var i = 0; i < arr.length; i++){
    var r = arr[i];
    if(!r || typeof r !== 'object'){ warnings.push((i+1) + '件目: オブジェクトではありません'); continue; }

    var qtext = (typeof r.q === 'string') ? r.q.trim() : '';
    if(!qtext){ warnings.push((i+1) + '件目: q（問題文）がありません'); continue; }

    if(!Array.isArray(r.options) || r.options.length < 2){
      warnings.push((i+1) + '件目: options が2つ以上の配列ではありません（' + qtext.slice(0,18) + '…）');
      continue;
    }
    var options = r.options.slice(0, LETTERS.length).map(function(o){ return String(o); });
    /* 空の選択肢を通すと、それが正解に指定されたとき「空のボタンが正解」になる。
       Notion 経路と同じく弾く。 */
    if(options.some(function(o){ return !o.trim(); })){
      warnings.push((i+1) + '件目: 空の選択肢があります（' + qtext.slice(0,18) + '…）');
      continue;
    }

    var ans = normAnswer(r.answer, options);
    if(ans < 0){
      warnings.push((i+1) + '件目: answer が選択肢を指していません（' + qtext.slice(0,18) + '…）');
      continue;
    }

    var id = (r.id === 0 || r.id) ? String(r.id) : hashId(qtext);
    /* id も連想配列のキーになる。プロトタイプ名だと「重複」と誤判定されて捨てられる。 */
    if(isProtoKey(id)) id = hashId(qtext);
    if(seen[id]){
      warnings.push('id "' + id + '" が重複しています。後ろの1件を無視しました。');
      continue;
    }
    seen[id] = true;

    var ch = parseInt(r.chapter, 10);
    if(isNaN(ch)) ch = 0;

    /* 数字だけの tag（"12"）には # を補う。"as-of" のような語のタグはそのまま扱う。 */

    if(tag && tag.charAt(0) !== '#' && /^[0-9]+$/.test(tag)) tag = '#' + tag;

    list.push({
      id        : id,
      chapter   : ch,
      tag       : tag,
      q         : qtext,
      options   : options,
      answer    : ans,
      explanation: (typeof r.explanation === 'string') ? r.explanation : '',
      source    : (typeof r.source === 'string') ? r.source.trim() : '',

      addedAt   : (typeof r.addedAt === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.addedAt)) ? r.addedAt : ''

  var titles = {};

    titles[n] = chapTitles[String(n)] || DEFAULT_CHAPTER_TITLES[n] || '';
  });

  return { list:list, warnings:warnings, chapters:chapters, titles:titles };
}

}

function statusOf(id){
  var s = statOf(id);
  if(!s || !s.seen) return 'new';
  return s.last === 'wrong' ? 'wrong' : 'ok';
}

  var s = statOf(id);
  if(!s || !s.seen) return -1;
  return s.correct / s.seen;

  var i = (streak | 0) - 1;
  if(i < 0) i = 0;
  if(i >= DUE_DAYS.length) i = DUE_DAYS.length - 1;
  return DUE_DAYS[i];
}
/* iso からの経過日数。時刻が壊れていたら 0（＝まだ期限ではない）扱い。 */
function daysSince(iso, nowMs){
  var t = Date.parse(iso);
  if(isNaN(t)) return 0;
  var d = ((nowMs === undefined ? Date.now() : nowMs) - t) / 86400000;
  return d > 0 ? d : 0;
}
/* 連続正解回数。streak を持たない古い記録は、直近正解なら1回とみなす。
   まだ一度も解いていない（seen が 0）なら 0。 */
function streakOf(s){
  if(!s || !s.seen) return 0;
  if(s.streak === undefined) return s.last === 'wrong' ? 0 : 1;
  return s.streak | 0;
}
/* 期限をどれだけ過ぎたか（日）。過ぎていなければ負。 */
function dueOver(id, nowMs){
  var s = statOf(id);
  if(!s || !s.seen || s.last === 'wrong') return -1;
  return daysSince(s.lastAt, nowMs) - dueSpan(streakOf(s));
}
/* 直近は正解だが、間隔を過ぎた問題 */
function isDue(id, nowMs){ return dueOver(id, nowMs) >= 0; }

/* 説明モードの自己申告を記録する。stats とは別枠。 */
function recordExplain(q, ok){
  var e = state.explain[q.id];
  if(!e || typeof e !== 'object') e = { seen:0, ok:0, last:null, lastAt:null };
  e.seen   = (e.seen | 0) + 1;
  e.ok     = (e.ok | 0) + (ok ? 1 : 0);
  e.last   = ok ? 'ok' : 'ng';
  e.lastAt = new Date().toISOString();
  state.explain[q.id] = e;
  saveState();
}
function explainOf(id){
  var e = state.explain[id];
  return (e && typeof e === 'object') ? e : null;
}
/* 「4択では取れるが、説明はできない」問題。次に設計書へ戻るべき場所。 */
function poolCantExplain(){
  return QUESTIONS.filter(function(q){
    var e = explainOf(q.id);
    return e && e.seen && e.last === 'ng';
  });
}

function recordAnswer(q, ok){
  var s = state.stats[q.id];
  if(!s || typeof s !== 'object') s = { seen:0, correct:0, wrong:0, last:null, lastAt:null };
  /* streak は last を書き換える前に読む。あとで読むと今回の結果が混ざって1回多く数える。 */
  var prevStreak = streakOf(s);
  s.seen    = (s.seen | 0) + 1;
  s.correct = (s.correct | 0) + (ok ? 1 : 0);
  s.wrong   = (s.wrong | 0) + (ok ? 0 : 1);
  s.last    = ok ? 'correct' : 'wrong';
  /* 連続正解の回数。間違えたら 0 に戻す。次の復習までの間隔をこれで決める。 */
  s.streak  = ok ? (prevStreak + 1) : 0;
  s.lastAt  = new Date().toISOString();
  state.stats[q.id] = s;
  saveState();
}

/* ============================================================
   5. 出題ロジック
   ============================================================ */
function shuffle(a){
  var arr = a.slice(), i, j, t;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* 出題順：間違い → そろそろ忘れる頃 → 未挑戦 → 済み（済みは正答率の低い順）。
   忘れかけを未挑戦より前に置くのは、覚え直しの方が急ぐため。 */
function prioritize(list){
  var wrong = [], due = [], fresh = [], done = [];
  var now = Date.now();
  list.forEach(function(q){
    var st = statusOf(q.id);
    if(st === 'wrong') wrong.push(q);
    else if(st === 'new') fresh.push(q);
    else if(isDue(q.id, now)) due.push(q);
    else done.push(q);
  });
  due  = shuffle(due).sort(function(a,b){ return dueOver(b.id, now) - dueOver(a.id, now); });
  done = shuffle(done).sort(function(a,b){ return accuracyOf(a.id) - accuracyOf(b.id); });
  return shuffle(wrong).concat(due, shuffle(fresh), done);
}

/* 選択肢を毎回シャッフルして返す（元の問題オブジェクトは書き換えない）。
   元データは正解が特定の位置に偏りがちで、「迷ったらB」で当たってしまうため。
   解説が選択肢を位置で参照していると壊れるので、解説は内容で指す書き方にすること。 */
function withShuffledOptions(q){
  var order = shuffle(q.options.map(function(_, i){ return i; }));
  return {
    id:q.id, chapter:q.chapter, tag:q.tag, q:q.q,
    options: order.map(function(i){ return q.options[i]; }),
    answer: order.indexOf(q.answer),
    explanation:q.explanation, source:q.source, method:q.method, addedAt:q.addedAt
  };
}

function poolAll(){ return QUESTIONS; }
function poolChapter(n){ return QUESTIONS.filter(function(q){ return q.chapter === n; }); }
function poolMethod(m){ return QUESTIONS.filter(function(q){ return q.method === m; }); }

/* 出てくる方式の一覧。方式設計書の順に並べ、そこに無いものは後ろに回す。
   問題データに新しい方式が現れれば、そのまま増える。 */
var METHOD_ORDER = ['構成・前提','処理方式','データ方式','認証・権限方式',
                    '運用・監視方式','コスト方式','IaC方式','設計判断'];
function methodList(){
  var seen = bare(), out = [];
  QUESTIONS.forEach(function(q){ if(q.method) seen[q.method] = true; });
  METHOD_ORDER.forEach(function(m){ if(seen[m]){ out.push(m); delete seen[m]; } });
  return out.concat(Object.keys(seen).sort());
}
function poolWrong(){ return QUESTIONS.filter(function(q){ return statusOf(q.id) === 'wrong'; }); }
function poolDue(){
  var now = Date.now();
  return QUESTIONS.filter(function(q){ return isDue(q.id, now); });
}
/* 「最近追加された問題」の並び。
   追加日の新しい順。同じ日の中では【未挑戦 → 間違い → 正解済み】の順にする。

   ここだけ他のモードと順序が違う。このモードの役目は「今日足した分を解く」
   ことなので、未挑戦を先に出さないと、間違えた問題が10問の枠を埋めてしまい、
   同じ日に11問以上足したとき新しい問題が一度も出てこない。 */
function poolRecent(){
  var groups = bare(), days = [];
  QUESTIONS.forEach(function(q){
    if(!groups[q.addedAt]){ groups[q.addedAt] = []; days.push(q.addedAt); }
    groups[q.addedAt].push(q);
  });
  days.sort(function(a, b){ return a < b ? 1 : (a > b ? -1 : 0); });   // 降順・空文字は最後

  var out = [];
  days.forEach(function(d){
    var fresh = [], wrong = [], done = [];
    groups[d].forEach(function(q){
      var st = statusOf(q.id);
      if(st === 'new') fresh.push(q);
      else if(st === 'wrong') wrong.push(q);
      else done.push(q);
    });
    done = shuffle(done).sort(function(a, b){ return accuracyOf(a.id) - accuracyOf(b.id); });
    out = out.concat(shuffle(fresh), shuffle(wrong), done);
  });
  return out;
}

/* 今の最大 id（数値のもののみ）。追加時の採番に使う。 */
/* 採番に使う「これまでの最大 id」。今ある問題だけでなく、学習記録に残っている
   id も見る。消した問題の番号を再利用すると、新しい問題がその成績を
   引き継いでしまうため。 */
function maxNumericId(){
  var m = 0;
  /* 安全整数の範囲だけを見る。2^53 以上の id が1つ紛れると ++nextId が
     丸めで増えなくなり、以後「id を省いた追加」が永久に重複扱いで弾かれる。 */
  var bump = function(v){
    var n = Number(v);
    if(!isNaN(n) && n > m && n < Number.MAX_SAFE_INTEGER) m = n;
  };
  QUESTIONS.forEach(function(q){ bump(q.id); });
  try{
    Object.keys(state.stats || {}).forEach(bump);
  }catch(e){ /* 記録が読めなくても採番は続ける */ }
  return m;
}

function buildSession(mode, chapter){
  var list, label;
  if(mode === 'all'){
    list  = prioritize(poolAll()).slice(0, PICK_N);
    label = '全範囲 ' + list.length + '問';
  }else if(mode === 'chapter'){
    list  = prioritize(poolChapter(chapter)).slice(0, SESS_MAX);
    label = chapterLabel(chapter);
  }else if(mode === 'wrong'){
    list  = prioritize(poolWrong()).slice(0, SESS_MAX);
    label = '間違いのみ';
  }else if(mode === 'due'){
    list  = prioritize(poolDue()).slice(0, PICK_N);
    label = 'そろそろ復習';
  }else if(mode === 'method'){
    list  = prioritize(poolMethod(chapter)).slice(0, SESS_MAX);   // chapter に方式名が入る
    label = String(chapter);
  }else if(mode === 'recent'){
    list  = poolRecent().slice(0, PICK_N);
    label = '最近追加された問題';
  }else{
    list = []; label = '';
  }
  var ex = explainMode();
  return { mode:mode, chapter:(chapter === undefined ? null : chapter),
           label:label + (ex ? '（説明）' : ''), explain:ex,
           list:list.map(withShuffledOptions), idx:0, answers:[] };
}

/* 説明モードのオン・オフ。ホームのスイッチが唯一の入口。 */
function explainMode(){
  var sw = $('explainSw');
  return !!(sw && sw.checked);
}

  $('cntWrong').textContent  = nWrong + '問';

      var st = statusOf(q.id);

    });

    body.appendChild(el('span', 'cnt', pool.length + '問' + (w ? '　要復習 ' + w : '')));

  // 章別ボタン

    m.setAttribute('role', 'img');

  // セッション履歴

  if(!state.sessions.length){

      row.appendChild(el('span', 'hs', h.correct + '/' + h.total));

    });
