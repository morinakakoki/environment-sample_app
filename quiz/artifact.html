   9. 結果画面
   ============================================================ */
function finish(){
  var total = session.answers.length;
  var corr  = session.answers.filter(function(a){ return a.ok; }).length;

  // 章別集計
  var per = {};
  session.answers.forEach(function(a){
    var k = a.chapter;
    if(!per[k]) per[k] = { total:0, correct:0, wrongTags:[] };
    per[k].total++;
    if(a.ok){ per[k].correct++; }
    else if(a.tag && per[k].wrongTags.indexOf(a.tag) < 0){ per[k].wrongTags.push(a.tag); }
  });

  // 履歴に保存
  var nowIso = new Date().toISOString();
  var rec = { at:nowIso, mode:session.mode, label:session.label, total:total, correct:corr,
              detail: encodeDetail(nowIso, session.answers) };
  state.sessions.unshift(rec);
  trimSessions(null);
  saveState();

  // スコア
  $('rsCorrect').textContent = corr;
  $('rsTotal').textContent   = total;
  var pct = total ? Math.round(corr / total * 100) : 0;
  $('rsPct').textContent = '正答率 ' + pct + '%　（' + session.label + '）';
  $('rsMsg').textContent =
    pct === 100 ? '全問正解。次の章に進んでOK。' :
    pct >= 80   ? 'いい感じ。間違えた分だけ章に戻ろう。' :
    pct >= 50   ? '半分は取れている。下の「戻る章」を読み直そう。' :
                  'ここは基礎知識ノートに戻る合図。焦らず読み直そう。';

  // 「戻る章」＝間違いのあった章を、正答率の低い順に
  var backs = Object.keys(per)
    .map(function(k){
      var p = per[k];
      return { ch:Number(k), total:p.total, correct:p.correct, rate:p.correct / p.total, tags:p.wrongTags };
    })
    .filter(function(x){ return x.correct < x.total; })
    .sort(function(a,b){ return a.rate - b.rate || b.total - a.total; });

  var bc = $('rsBackChap');
  clear(bc);
  if(backs.length){
    var box = el('div', 'backchap');
    box.appendChild(el('div', 'lbl', '戻る章（基礎知識ノート）'));
    var ul = el('ul');
    backs.forEach(function(x){
      var li = el('li');
      li.appendChild(el('span', 'cn', chapterFull(x.ch)));
      li.appendChild(document.createTextNode(
        x.correct + ' / ' + x.total + '問正解　→ ' + (x.total - x.correct) + '問を復習'));
      if(x.tags.length){
        var tg = el('div', 'tg');
        tg.appendChild(el('span', null, '見直す項目：'));
        x.tags.forEach(function(t){ tg.appendChild(el('span', 'chip tag', t)); });
        li.appendChild(tg);
      }
      ul.appendChild(li);
    });
    box.appendChild(ul);
    bc.appendChild(box);
  }else{
    var okbox = el('div', 'backchap');
    okbox.style.borderColor = 'var(--ok-line)';
    okbox.style.background  = 'var(--ok-bg)';
    var lbl = el('div', 'lbl', '戻る章はありません');
    lbl.style.color = 'var(--ok)';
    okbox.appendChild(lbl);
    okbox.appendChild(el('div', null, 'このセッションは全問正解でした。新しい章へ進みましょう。'));
    bc.appendChild(okbox);
  }

  // 章別スコア
  var cs = $('rsChapters');
  clear(cs);
  Object.keys(per).map(Number).sort(function(a,b){ return a - b; }).forEach(function(n){
    var p = per[n];
    var rate = Math.round(p.correct / p.total * 100);
    var row = el('div', 'chaprow');
    row.appendChild(el('span', 'no', chapterLabel(n)));
    row.appendChild(el('span', 'nm', CHAPTER_TITLES[n] || '—'));
    var m = el('span', 'meter' + (rate >= 80 ? ' good' : (rate < 50 ? ' bad' : '')));
    var f = el('i'); f.style.width = rate + '%'; m.appendChild(f);
    row.appendChild(m);
    row.appendChild(el('span', 'pct', p.correct + '/' + p.total));
    cs.appendChild(row);
  });

  // 間違えた問題の振り返り
  var rv = $('rsReview');
  clear(rv);
  var wrongs = session.answers.filter(function(a){ return !a.ok; });
  if(!wrongs.length){
    hide($('rsReviewCard'));
  }else{
    show($('rsReviewCard'));
    wrongs.forEach(function(a){
      var q = null, i;
      for(i = 0; i < session.list.length; i++){ if(session.list[i].id === a.id){ q = session.list[i]; break; } }
      if(!q) return;
      var box = el('div', 'rev');
      var chips = el('div', 'chips');
      chips.appendChild(el('span', 'chip', chapterFull(q.chapter)));
      if(q.tag) chips.appendChild(el('span', 'chip tag', '理解度表 ' + q.tag));
      if(q.method) chips.appendChild(el('span', 'chip method', q.method));
      box.appendChild(chips);
      box.appendChild(el('div', 'rq', q.q));
      var ans = el('div', 'ans');
      var l1 = el('span', 'l', 'あなたの解答');
      ans.appendChild(l1);
      ans.appendChild(el('span', 'you', LETTERS[a.picked] + '. ' + q.options[a.picked]));
      ans.appendChild(el('br'));
      var l2 = el('span', 'l', '正解'); l2.style.marginTop = '6px';
      ans.appendChild(l2);
      ans.appendChild(el('span', 'cor', LETTERS[q.answer] + '. ' + q.options[q.answer]));
      box.appendChild(ans);
      if(q.explanation) box.appendChild(el('div', 'rexp', q.explanation));
      if(q.source) box.appendChild(sourceLink(q.source));
      rv.appendChild(box);
    });
  }

  syncLog();   // 非同期。失敗しても次に開いたときに送り直す

  var rwBtn = $('retryWrongBtn');
  rwBtn.disabled = (poolWrong().length === 0);
  /* 同じモードで出題できるものが残っているときだけ押せるようにする */
  var again = $('againBtn');
  again.disabled = (buildSession(session.mode, session.chapter).list.length === 0);
  again.textContent = again.disabled ? 'このモードで解ける問題はありません' : '同じモードでもう一度';

  goto('screenResult');
}

/* ============================================================
   9.3 学習記録を Notion と同期する
   ============================================================ */
var logState = { status:'idle', msg:'', fix:'', pulled:0, pushed:0, pending:0,
                 truncated:false, inflight:null };
/* リセットしたら番号を進める。走っている同期の結果はその時点で無効になる。 */
var syncEpoch = 0;

/* id に : や , が入っても壊れないようにする。
   notion:<hex> は長いので n~<hex> に縮める（テキスト欄の字数を節約）。 */
function encId(id){
  return encodeURIComponent(id.indexOf('notion:') === 0 ? ('n~' + id.slice(7)) : id);
}
function decId(t){
  var d;
  try{ d = decodeURIComponent(t); }catch(e){ d = t; }
  return d.indexOf('n~') === 0 ? ('notion:' + d.slice(2)) : d;
}

/* "@<正確な日時>|id:1,id:0,..." の形。日時を入れておくと、
   Notion 側が秒を丸めても、送信済みかどうかを取り違えない。 */
function encodeDetail(at, answers){
  var body = answers.map(function(a){ return encId(a.id) + ':' + (a.ok ? 1 : 0); }).join(',');
  var head = '@' + at + '|';
  if(head.length + body.length > LOG.maxDetail){
    body = body.slice(0, LOG.maxDetail - head.length - 1);
    var cut = body.lastIndexOf(',');
    body = (cut > 0 ? body.slice(0, cut) : '') + '+';   // 途中で切れた印
  }
  return head + body;
}

/* 明細を解く。アプリが書いた "@<日時>|..." 形式のものだけを信用する。
   手で書かれた行や書式の違う行から正誤を取り込むと、実在する id と
   たまたま一致したときに架空の解答履歴が混ざってしまうため。
   その場合も出題数・正解数の列は使えるので、履歴としては残る。 */
function parseDetail(text){
  var out = { at:'', pairs:[], truncated:false, trusted:false };
  if(!text) return out;
  var bar = text.indexOf('|');
  if(text.charAt(0) !== '@' || bar <= 0) return out;   // アプリが書いたものではない
  out.trusted = true;
  out.at = text.slice(1, bar);
  text = text.slice(bar + 1);
  if(text.charAt(text.length - 1) === '+'){ out.truncated = true; text = text.slice(0, -1); }
  text.split(',').forEach(function(t){
    if(!t) return;
    var i = t.lastIndexOf(':');
    if(i <= 0) return;
    out.pairs.push({ id:decId(t.slice(0, i)), ok:t.slice(i + 1) === '1' });
  });
  return out;
}

/* Notion 側の記録を取り込む。
   直近の正誤は「新しい方」を採り、回数は多い方を採る（減らさない）。 */
/* 履歴を HIST_MAX 件に切り詰める。ただし未送信ぶんは必ず残す。 */
function trimSessions(remoteKeys){
  if(state.sessions.length <= HIST_MAX) return;
  var keep = [], overflow = [];
  state.sessions.forEach(function(x, i){
    var unsent = x.detail && !(remoteKeys && remoteKeys[x.at]);
    if(i < HIST_MAX || unsent) keep.push(x); else overflow.push(x);
  });
  state.sessions = keep;
}

function mergeRemoteLog(rows){
  var remoteKeys = {}, remoteSessions = [], tmp = {};

  rows.forEach(function(r){
    var d = parseDetail(r[LOG.cols.detail] || '');
    var at = d.at || String(r['date:' + LOG.cols.date + ':start'] || '');
    if(!at) return;
    remoteKeys[at] = true;
    remoteSessions.push({
      at: at,
      mode: '',
      label: String(r[LOG.cols.mode] || ''),
      total: Number(r[LOG.cols.total]) || 0,
      correct: Number(r[LOG.cols.correct]) || 0
    });
    d.pairs.forEach(function(pr){
      var t = tmp[pr.id] || (tmp[pr.id] = { seen:0, correct:0, wrong:0, last:null, lastAt:null });
      t.seen++;
      if(pr.ok) t.correct++; else t.wrong++;
      if(!t.lastAt || at > t.lastAt){ t.lastAt = at; t.last = pr.ok ? 'correct' : 'wrong'; }
    });
  });

  var changed = false;
  Object.keys(tmp).forEach(function(id){
    var r = tmp[id];
    var l = state.stats[id];
    if(!l){ state.stats[id] = r; changed = true; return; }
    var merged = {
      seen   : Math.max(l.seen | 0, r.seen),
      correct: Math.max(l.correct | 0, r.correct),
      wrong  : Math.max(l.wrong | 0, r.wrong),
      last   : l.last,
      lastAt : l.lastAt
    };
    if(!l.lastAt || (r.lastAt && r.lastAt > l.lastAt)){ merged.last = r.last; merged.lastAt = r.lastAt; }
    if(merged.seen !== (l.seen|0) || merged.correct !== (l.correct|0) ||
       merged.wrong !== (l.wrong|0) || merged.last !== l.last){ changed = true; }
    state.stats[id] = merged;
  });

  /* セッション履歴も混ぜて、新しい順に並べ直す */
  var have = {};
  state.sessions.forEach(function(x){ have[x.at] = true; });
  remoteSessions.forEach(function(x){ if(!have[x.at]){ state.sessions.push(x); have[x.at] = true; changed = true; } });
  state.sessions.sort(function(a, b){ return a.at < b.at ? 1 : (a.at > b.at ? -1 : 0); });

  /* 打ち切りで「まだ送っていないセッション」を捨てない。
     Notion 側に古い記録がたまっていると、オフラインで解いたぶんが
     送る前に押し出されて永久に消えてしまうため。 */
  trimSessions(remoteKeys);

  if(changed) saveState();
  return remoteKeys;
}

/* まだ Notion に無いローカルのセッションを送る */
function pushSessions(mcp, remoteKeys){
  var all = state.sessions.filter(function(x){ return x.detail && !remoteKeys[x.at]; });
  var todo = all.slice(0, LOG.maxPush);
  if(all.length > todo.length) logState.pending = all.length - todo.length;

  if(!todo.length){ renderSyncLine(); return Promise.resolve(); }

  var pages = todo.map(function(x){
    var props = {};
    props[LOG.cols.title]  = fmtWhen(x.at) + ' ' + (x.label || '') + ' ' + x.correct + '/' + x.total + '正解';
    props['date:' + LOG.cols.date + ':start'] = x.at;
    props['date:' + LOG.cols.date + ':is_datetime'] = 1;
    props[LOG.cols.mode]    = x.label || '';
    props[LOG.cols.total]   = x.total;
    props[LOG.cols.correct] = x.correct;
    props[LOG.cols.rate]    = x.total ? Math.round(x.correct / x.total * 100) / 100 : 0;
    props[LOG.cols.detail]  = x.detail;
    return { properties: props };
  });

  return mcp.callTool(LOG.server, LOG.write, {
    parent: { type:'data_source_id', data_source_id: LOG.source },
    pages : pages
  }).then(function(){
    logState.pushed = todo.length;
    var sent = {};
    todo.forEach(function(x){ sent[x.at] = true; remoteKeys[x.at] = true; });
    trimSessions(remoteKeys);   // 送信済みになったので、あふれたぶんは切ってよい
    saveState();
    renderSyncLine();
    /* まだ残っているならもう一巡（積み上がったぶんを取りこぼさない） */
    if(logState.pending > 0) return pushSessions(mcp, remoteKeys);
  });
}

function syncLog(){
  if(!(window.claude && typeof window.claude.use === 'function')) return;
  /* 起動時と解き終わりの両方から呼ばれる。走っている最中にもう1本走ると、
     どちらも「まだ送っていない」と判断して同じセッションを2回書いてしまう。 */
  if(logState.inflight) return logState.inflight;

  logState.status = 'syncing';
  logState.truncated = false;
  renderSyncLine();
  var epoch = ++syncEpoch;

  logState.inflight = window.claude.use('mcp').then(function(mcp){
    if(!mcp){ logState.status = 'idle'; renderSyncLine(); return; }
    return readLogPages(mcp, undefined, [], 0).then(function(rows){
      if(epoch !== syncEpoch) return;   // 履歴リセットが挟まった。結果を捨てる
      var keys = mergeRemoteLog(rows);
      logState.pulled = rows.length;
      logState.status = 'ok';
      if($('screenQuiz').classList.contains('hidden')) renderHome();
      renderSyncLine();
      /* 全部読めていないと「Notion に既にあるか」を判断できない。
         この状態で送ると同じセッションを重ねて書いてしまうので送らない。 */
      if(logState.truncated) return;
      return pushSessions(mcp, keys);
    });
  }).catch(function(err){
    var f = notionFailure(err);
    logState.status = 'error';
    logState.msg = f.msg;
    logState.fix = f.fix;
    renderSyncLine();
  }).then(function(){
    logState.inflight = null;
  }, function(){
    logState.inflight = null;
  });

  return logState.inflight;
}

function readLogPages(mcp, cursor, acc, page){
  var input = { data: { mode:'view', view_url:LOG.view, page_size:100 } };
  if(cursor) input.data.start_cursor = cursor;
  return mcp.callTool(LOG.server, LOG.read, input).then(function(res){
    var p = res && res.payload;
    if(!p || !Array.isArray(p.results)) return acc;
    acc = acc.concat(p.results);
    if(p.has_more && p.next_cursor && page + 1 < LOG.maxPages){
      return readLogPages(mcp, p.next_cursor, acc, page + 1);
    }
    logState.truncated = !!p.has_more;   // 全部は読めていない
    return acc;
  });
}

function renderSyncLine(){
  var box = $('syncLine');
  if(!box) return;
  clear(box);
  box.className = 'notionline';
  if(logState.status === 'idle'){ hide(box); return; }
  show(box);

  if(logState.status === 'syncing'){ box.appendChild(el('span', null, '学習記録を同期しています…')); return; }

  if(logState.status === 'error'){
    box.className = 'notionline ng';
    box.appendChild(el('b', null, '学習記録を同期できませんでした。'));
    if(logState.fix) box.appendChild(el('span', null, logState.fix));
    box.appendChild(el('span', 'muted', 'この端末の記録はそのまま残っています。次に開いたときに送り直します。'));
    return;
  }
  box.className = 'notionline ok';
  var bits = [];
  if(logState.pulled)  bits.push('Notion から ' + logState.pulled + '件 取り込み');
  if(logState.pushed)  bits.push(logState.pushed + '件 送信');
  if(logState.pending) bits.push('未送信 ' + logState.pending + '件');
  if(logState.truncated) bits.push('記録が多いため一部のみ読み込み（今回は送信を見送りました）');
  box.appendChild(el('b', null, bits.length ? ('学習記録を同期しました（' + bits.join('・') + '）') : '学習記録は同期済みです'));
  box.appendChild(el('span', 'muted', '端末をまたいで引き継がれます。'));
}

/* ============================================================
   9.4 Notion から追加分を読む
   ============================================================ */
var notionState = { status:'idle', count:0, skipped:0, truncated:false, msg:'', fix:'' };

/* Notion の1行を、このアプリの問題に変換する。
   id は行の URL から作る（問題文を直しても学習記録が残るように）。 */
function rowToQuestion(row){
  var c = NOTION.cols;
  var q = String(row[c.q] || '').trim();
  if(!q) return null;

  var options = c.options.map(function(k){ return String(row[k] == null ? '' : row[k]).trim(); });
  if(options.some(function(o){ return !o; })) return null;   // 空欄がある行は使わない

  var ans = normAnswer(String(row[c.answer] || '').trim(), options);
  if(ans < 0) return null;

  var url = String(row.url || '');
  var m = url.match(/([0-9a-f]{32})/i);
  if(!m) return null;

  var tag = String(row[c.tag] == null ? '' : row[c.tag]).trim();
  if(tag && tag.charAt(0) !== '#' && /^[0-9]+$/.test(tag)) tag = '#' + tag;

  var ch = parseInt(row[c.chapter], 10);
  if(isNaN(ch)) ch = 0;

  return {
    id        : 'notion:' + m[1],
    chapter   : ch,
    tag       : tag,
    q         : q,
    options   : options,
    answer    : ans,
    explanation: String(row[c.explanation] == null ? '' : row[c.explanation]).trim(),
    source    : String(row[c.source] == null ? '' : row[c.source]).trim(),
    method    : String(row[c.method] == null ? '' : row[c.method]).trim(),
    addedAt   : String(row[c.date] || '').slice(0, 10)
  };
}

/* 失敗の種類ごとに、直し方が分かる文言を出す。
   ひとまとめの「エラーが起きました」にはしない。 */
function notionFailure(err){
  var code = (err && err.code) || '';
  var map = {
    needs_reauth        : ['Notion の接続が切れています。', 'claude.ai の設定 → コネクタ から Notion を繋ぎ直してください。'],
    server_not_connected: ['Notion コネクタが繋がっていません。', 'claude.ai の設定 → コネクタ から Notion を追加してください。'],
    not_granted         : ['Notion の読み取りが許可されていません。', 'このページを開き直して、確認ダイアログで許可してください。'],
    approval_required   : ['Notion の読み取りに承認が必要です。', '確認ダイアログで許可してください。'],
    selection_required  : ['どの Notion に繋ぐか選ばれていません。', '確認ダイアログで接続先を選んでください。'],
    blocked_by_policy   : ['組織の設定で Notion の読み取りが止められています。', '管理者に確認してください。'],
    server_not_found    : ['Notion コネクタが見つかりません。', 'claude.ai の設定 → コネクタ を確認してください。'],
    not_in_manifest     : ['このページは Notion の読み取りを宣言していません。', 'アプリを再発行し直す必要があります。'],
    tool_error          : ['Notion 側でエラーが返りました。', (err && err.message) || 'データベースや列名が変わっていないか確認してください。'],
    bad_request         : ['Notion への問い合わせ方が合っていません。', 'ビューが削除された可能性があります。'],
    cancelled           : ['Notion の読み取りが中断されました。', 'もう一度開き直すと読み込みます。'],
    capability_disabled : ['この表示では Notion を読めません。', ''],
    capability_removed  : ['この表示では Notion を読めません。', '']
  };
  var hit = map[code];
  if(hit) return { msg:hit[0], fix:hit[1] };
  return { msg:'Notion から読み込めませんでした。', fix:'しばらく待ってから開き直してください。（' + (code || '原因不明') + '）' };
}

function loadNotion(){
  if(!(window.claude && typeof window.claude.use === 'function')) return;

  notionState.status = 'loading';
  renderNotionLine();

  window.claude.use('mcp').then(function(mcp){
    if(!mcp){ notionState.status = 'idle'; renderNotionLine(); return; }   // この表示では使えない
    return fetchNotionPages(mcp, undefined, [], 0);
  }).catch(function(err){
    var f = notionFailure(err);
    /* 再試行してよいのは retryable が立っているものだけ。1回だけ。 */
    if(err && err.retryable && notionState.status !== 'retried'){
      notionState.status = 'retried';
      var wait = (err.retryAfterMs || 1200) + Math.floor(Math.random() * 600);
      window.setTimeout(function(){
        window.claude.use('mcp').then(function(mcp){
          if(mcp) return fetchNotionPages(mcp, undefined, [], 0);
        }).catch(function(e2){
          var f2 = notionFailure(e2);
          notionState.status = 'error'; notionState.msg = f2.msg; notionState.fix = f2.fix;
          renderNotionLine();
        });
      }, wait);
      return;
    }
    notionState.status = 'error';
    notionState.msg = f.msg;
    notionState.fix = f.fix;
    renderNotionLine();
  });
}

function fetchNotionPages(mcp, cursor, acc, page){
  var input = { data: { mode:'view', view_url:NOTION.view, page_size:100 } };
  if(cursor) input.data.start_cursor = cursor;

  return mcp.callTool(NOTION.server, NOTION.tool, input).then(function(res){
    var payload = res && res.payload;
    if(!payload || !Array.isArray(payload.results)){
      notionState.status = 'error';
      notionState.msg = 'Notion の応答が想定と違いました。';
      notionState.fix = 'データベースの列名が変わっていないか確認してください。';
      renderNotionLine();
      return;
    }
    acc = acc.concat(payload.results);

    if(payload.has_more && payload.next_cursor && page + 1 < NOTION.maxPages){
      return fetchNotionPages(mcp, payload.next_cursor, acc, page + 1);
    }
    notionState.truncated = !!payload.has_more;
    finishNotion(acc);
  });
}

function finishNotion(rows){
  var seen = {}, list = [], skipped = 0;
  EMBEDDED.forEach(function(q){ seen[q.id] = true; });
  rows.forEach(function(r){
    var q = rowToQuestion(r);
    if(!q){ skipped++; return; }
    if(seen[q.id]) return;
    seen[q.id] = true;
    list.push(q);
  });

  NOTION_Q = list;
  notionState.status = 'ok';
  notionState.count = list.length;
  notionState.skipped = skipped;
  applyQuestions();

  /* 解いている最中に問題数を入れ替えない */
  if($('screenQuiz').classList.contains('hidden')) renderHome();
  renderNotionLine();
}

function renderNotionLine(){
  var box = $('notionLine');
  if(!box) return;
  clear(box);
  box.className = 'notionline';

  if(notionState.status === 'idle'){ hide(box); return; }
  show(box);

  if(notionState.status === 'loading' || notionState.status === 'retried'){
    box.appendChild(el('span', null, 'Notion の問題を読み込んでいます…'));
    return;
  }
  if(notionState.status === 'error'){
    box.className = 'notionline ng';
    box.appendChild(el('b', null, notionState.msg));
    if(notionState.fix) box.appendChild(el('span', null, notionState.fix));
    box.appendChild(el('span', 'muted', '埋め込み分の ' + EMBEDDED.length + '問はこのまま解けます。'));
    return;
  }
  box.className = 'notionline ok';
  box.appendChild(el('b', null, notionState.count
    ? ('Notion から ' + notionState.count + '問 読み込みました')
    : 'Notion に追加分はありませんでした'));
  var notes = [];
  if(notionState.skipped) notes.push(notionState.skipped + '行は空欄か正解未設定のため読みませんでした');
  if(notionState.truncated) notes.push('件数が多いため一部のみ読み込みました');
  if(notes.length) box.appendChild(el('span', 'muted', notes.join('。')));
}

/* ============================================================
   9.5 問題の追加（貼り付け → 検証 → 保存）
   ============================================================ */
var addPending = null;   // 保存待ちの「追記後の全データ」

/* 生データの形（配列 / {chapters,questions}）を保ったまま問題を足す */
function mergeRaw(raw, incoming, chapters){
  var k;
  if(Array.isArray(raw) && !chapters) return raw.concat(incoming);
  var copy = {};
  if(!Array.isArray(raw)){ for(k in raw){ if(Object.prototype.hasOwnProperty.call(raw, k)) copy[k] = raw[k]; } }
  copy.questions = (Array.isArray(raw) ? raw : (raw.questions || [])).concat(incoming);
  if(chapters){
    var merged = {};
    var cur = Array.isArray(raw) ? {} : (raw.chapters || {});
    for(k in cur){ if(Object.prototype.hasOwnProperty.call(cur, k)) merged[k] = cur[k]; }
    for(k in chapters){ if(Object.prototype.hasOwnProperty.call(chapters, k)) merged[k] = String(chapters[k]); }
    copy.chapters = merged;
  }
  return copy;
}

/* ファイルに貼り戻しやすい形（1問1行）で書き出す */
function formatData(raw){
  if(Array.isArray(raw)){
    return '[\n' + raw.map(function(q){ return '  ' + JSON.stringify(q); }).join(',\n') + '\n]\n';
  }
  var qs = (raw.questions || []).map(function(q){ return '    ' + JSON.stringify(q); }).join(',\n');
  var head = Object.keys(raw)
    .filter(function(k){ return k !== 'questions'; })
    .map(function(k){ return '  ' + JSON.stringify(k) + ': ' + JSON.stringify(raw[k], null, 2).replace(/\n/g, '\n  '); })
    .join(',\n');
  return '{\n' + (head ? head + ',\n' : '') + '  "questions": [\n' + qs + '\n  ]\n}\n';
}

function addMsg(kind, title, lines){
  var box = $('addResult');
  clear(box);
  box.className = kind ? ('result ' + kind) : 'result';
  box.appendChild(el('b', null, title));
  if(lines && lines.length){
    var ul = el('ul');
    lines.forEach(function(t){ ul.appendChild(el('li', null, t)); });
    box.appendChild(ul);
  }
}

function addCheck(){
  hide($('addSaveWrap')); hide($('addManual'));
  addPending = null;

  var txt = $('addTa').value.trim();
  if(!txt){ addMsg('ng', 'JSON を貼り付けてください。'); return; }

  var parsed;
  try{ parsed = JSON.parse(txt); }
  catch(e){ addMsg('ng', 'JSON として読めませんでした。', [e.message, 'コードブロックの ```json や前後の説明文が混ざっていないか確認してください。']); return; }

  var incoming = Array.isArray(parsed) ? parsed
               : (parsed && Array.isArray(parsed.questions) ? parsed.questions : [parsed]);
  var newChapters = (parsed && !Array.isArray(parsed) && parsed.chapters) ? parsed.chapters : null;
  if(!incoming.length){ addMsg('ng', '追加する問題が入っていません。'); return; }

  /* id が無いものには、今の最大 id の続きを振る。
     Claude に「id は何番から」と毎回伝えなくても貼れるようにするため。 */
  var nextId = maxNumericId();
  var today = new Date().toISOString().slice(0, 10);
  incoming = incoming.map(function(r){
    if(!r || typeof r !== 'object') return r;
    var needsId   = !(r.id === 0 || r.id);
    var needsDate = typeof r.addedAt !== 'string' || !r.addedAt;
    if(!needsId && !needsDate) return r;
    var copy = {}, k;
    for(k in r){ if(Object.prototype.hasOwnProperty.call(r, k)) copy[k] = r[k]; }
    if(needsId)   copy.id = ++nextId;
    /* addedAt が無いと「最近追加された問題」に一度も出てこないので、今日を入れる */
    if(needsDate) copy.addedAt = today;
    return copy;
  });

  /* 形式が壊れている行は、保存データに混ぜない。
     読み込み時に弾かれるだけとはいえ、残しておくと毎回警告が出続ける。 */
  var before = incoming.length;
  incoming = incoming.filter(function(r){
    try{ return parseData([r]).list.length === 1; }
    catch(e){ return false; }
  });
  var malformed = before - incoming.length;
  if(!incoming.length){
    addMsg('ng', '取り込める問題がありませんでした。',
      [before + '件すべてが形式エラーです。',
       'options が4つあるか、answer が選択肢を指しているか確認してください。']);
    return;
  }

  var candidate = mergeRaw(RAW_DATA, incoming, newChapters);
  var res;
  try{ res = parseData(candidate); }
  catch(e){ addMsg('ng', '取り込めませんでした。', [e.message]); return; }

  var have = {};
  QUESTIONS.forEach(function(q){ have[q.id] = true; });
  var fresh = res.list.filter(function(q){ return !have[q.id]; });

  if(!fresh.length){
    addMsg('ng', '新しく追加される問題がありませんでした。', 
      ['id が既存とかぶっている可能性があります（かぶった問題は取り込まれません）。',
       '今の最大 id は ' + maxNumericId() + ' です（id を省けば自動で続きを振ります）。']);
    return;
  }

  var lines = [];
  var byCh = {};
  fresh.forEach(function(q){ byCh[q.chapter] = (byCh[q.chapter] || 0) + 1; });
  Object.keys(byCh).map(Number).sort(function(a, b){ return a - b; }).forEach(function(c){
    var isNew = CHAPTERS.indexOf(c) < 0;
    lines.push(chapterLabel(c) + ' ' + (res.titles[c] || '（タイトル未設定）') + ' … ' + byCh[c] + '問'
      + (isNew ? '  ← 新しい章' : ''));
  });
  var tags = [];
  fresh.forEach(function(q){ if(q.tag && tags.indexOf(q.tag) < 0) tags.push(q.tag); });
  if(tags.length) lines.push('タグ: ' + tags.join(' '));

  /* id は違うが問題文が既存と同じ、というのは作り直しのときに起きやすい */
  var norm = function(t){ return t.replace(/\s+/g, '').replace(/[。、．，]/g, ''); };
  var existingText = {};
  QUESTIONS.forEach(function(q){ existingText[norm(q.q)] = q.id; });
  fresh.forEach(function(q){
    var hit = existingText[norm(q.q)];
    if(hit) lines.push('⚠ id ' + q.id + ' は id ' + hit + ' と問題文がほぼ同じです');
  });

  if(malformed > 0) lines.push('⚠ ' + malformed + '件は形式エラーのため除きました');
  var dupes = incoming.length - fresh.length;
  if(dupes > 0) lines.push('⚠ ' + dupes + '件は id が既存とかぶるため取り込まれません');
  res.warnings.forEach(function(w){ lines.push('⚠ ' + w); });

  addMsg('ok', fresh.length + '問を追加します（このアプリに埋め込む分が ' + res.list.length + '問'
    + (NOTION_Q.length ? '、Notion 分と合わせて ' + (res.list.length + NOTION_Q.length) + '問' : '')
    + 'になります）', lines);
  addPending = candidate;

  if(canPublish()) show($('addSaveWrap')); else show($('addManual'));
}

/* 自分自身を新しいバージョンとして保存できるか */
function canPublish(){
  return !!(document.getElementById('appStyle') &&
            document.getElementById('bodyTpl') &&
            document.getElementById('appScript') &&
            window.claude && typeof window.claude.use === 'function');
}

/* 保存する版のHTMLを組み立てる。画面の今の状態ではなく、
   「元のマークアップ＋新しいデータ」から必ず作り直す。 */
/* document.title は、埋め込み先（ホスト）のタイトルを拾ってしまうことがある。
   自分の <title id="appTitle"> を直接読む。 */
function appTitle(){
  var t = document.getElementById('appTitle');
  return (t && t.textContent.trim()) || document.title;
}

function buildDocument(rawData){
  var st = document.getElementById('appStyle');
  var tp = document.getElementById('bodyTpl');
  var ap = document.getElementById('appScript');
  if(!st || !tp || !ap) return null;
  var C  = '<' + '/script>';
  var SO = '<' + 'script';
  var json = JSON.stringify(rawData).replace(/<\//g, '<\\/');
  return [
    '<!doctype html>',
    '<html lang="ja">',
    '<head>',
    '<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
    '<meta name="color-scheme" content="light dark">',
    '<title id="appTitle">' + appTitle() + '<' + '/title>',
    '<style id="appStyle">' + st.textContent + '<' + '/style>',
    '</head>',
    '<body>',
    SO + ' type="application/json" id="quizData">' + json + C,
    SO + ' type="text/plain" id="bodyTpl">' + tp.textContent + C,
    '<div id="root"></div>',
    SO + ' id="appScript">' + ap.textContent + C,
    '</body>',
    '</html>',
    ''
  ].join('\n');
}

function addSave(){
  if(!addPending) return;
  var btn = $('addSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存しています…';

  var html = buildDocument(addPending);
  if(!html){
    addMsg('ng', 'この画面では保存できません。'); 
    hide($('addSaveWrap')); show($('addManual'));
    btn.disabled = false; btn.textContent = 'この内容で保存';
    return;
  }

  window.claude.use('artifact').then(function(api){
    if(!api) throw new Error('not_granted');
    return api.publish(html);
  }).then(function(){
    addMsg('ok', '保存しました。新しい問題を読み込みます…');
    btn.textContent = '保存しました';
    /* 通常は全ビューが自動で読み込み直されるが、そうならなかったときの保険。
       ただし解き始めていたら巻き戻さない（次に開いたときに反映される）。 */
    window.setTimeout(function(){
      if(!$('screenQuiz').classList.contains('hidden')) return;
      try{ location.reload(); }catch(e){}
    }, 4000);
  }).catch(function(e){
    var code = (e && (e.code || e.message)) || '';
    btn.disabled = false; btn.textContent = 'この内容で保存';
    if(String(code).indexOf('conflict') >= 0){
      addMsg('ng', '別の端末で先に保存されたようです。', ['画面を読み込み直してから、もう一度貼り付けてください。']);
    }else if(String(code).indexOf('not_granted') >= 0 || String(code).indexOf('not_writer') >= 0){
      addMsg('ng', 'このビューには保存する権限がありません。', ['作成者本人として開いてください。']);
      hide($('addSaveWrap')); show($('addManual'));
    }else{
      addMsg('ng', '保存できませんでした。', [String(code)]);
      show($('addManual'));
    }
  });
}

function addCopy(){
  if(!addPending) return;
  var text = formatData(addPending);
  var btn = $('addCopyBtn');
  var done = function(okFlag){
    btn.textContent = okFlag ? 'コピーしました' : 'コピーできませんでした';
    window.setTimeout(function(){ btn.textContent = '追記後の JSON 全文をコピー'; }, 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, done); });
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var okFlag = false;
  try{ okFlag = document.execCommand('copy'); }catch(e){ okFlag = false; }
  document.body.removeChild(ta);
  done(okFlag);
}

function openAdd(){
  $('addTa').value = '';
  clear($('addResult'));
  $('addResult').className = '';
  hide($('addSaveWrap')); hide($('addManual'));
  addPending = null;
  goto('screenAdd');
}

/* ============================================================
   10. テーマ
   ============================================================ */
/* アーティファクトとして iframe 内で動くときは、テーマは閲覧者の設定に従って
   ホストが data-theme を付ける。こちらが触ると上書きしてしまうので何もしない。 */
var HOST_THEME;
try{ HOST_THEME = (window.self !== window.top); }
catch(e){ HOST_THEME = true; }   /* クロスオリジンで参照できない＝埋め込まれている */

function applyTheme(v){
  var root = document.documentElement;
  if(HOST_THEME){ hide($('themeBtn')); return; }
  if(v === 'light' || v === 'dark') root.setAttribute('data-theme', v);
  else root.removeAttribute('data-theme');
  var b = $('themeBtn');
  b.textContent = v === 'light' ? '☀️' : (v === 'dark' ? '🌙' : '🌓');
  b.title = '表示テーマ：' + (v === 'light' ? 'ライト' : v === 'dark' ? 'ダーク' : '端末の設定に従う');
  b.setAttribute('aria-label', b.title + '（切り替え）');
}
function cycleTheme(){
  var cur = loadTheme();
  var nextV = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
  saveTheme(nextV);
  applyTheme(nextV);
}

/* ============================================================
   11. イベント配線
   ============================================================ */
function wire(){
  $('themeBtn').addEventListener('click', cycleTheme);
  $('homeBtn').addEventListener('click', function(){ session = null; renderHome(); goto('screenHome'); });

  $('modeAll').addEventListener('click',    function(){ startSession('all'); });
  $('modeWrong').addEventListener('click',  function(){ startSession('wrong'); });
  $('modeRecent').addEventListener('click', function(){ startSession('recent'); });

  $('nextBtn').addEventListener('click', next);

  $('againBtn').addEventListener('click', function(){
    if(session) startSession(session.mode, session.chapter);
  });
  /* 「間違いのみ」を全問正解したあとは、同じモードで解き直せない */
  $('againBtn').disabled = false;
  $('retryWrongBtn').addEventListener('click', function(){ startSession('wrong'); });
  $('toHomeBtn').addEventListener('click', function(){ session = null; renderHome(); goto('screenHome'); });

  $('addBtn').addEventListener('click', openAdd);
  $('addBackBtn').addEventListener('click', function(){ renderHome(); goto('screenHome'); });
  $('addCheckBtn').addEventListener('click', addCheck);
  /* 確認したあとに本文を書き換えたら、確認結果を捨てる。
     画面と違う内容が保存されるのを防ぐ。 */
  $('addTa').addEventListener('input', function(){
    if(!addPending) return;
    addPending = null;
    hide($('addSaveWrap')); hide($('addManual'));
    addMsg('', '内容が変わりました。もう一度「内容を確認」を押してください。');
  });
  $('addSaveBtn').addEventListener('click', addSave);
  $('addCopyBtn').addEventListener('click', addCopy);

  $('resetBtn').addEventListener('click', function(){
    if(!window.confirm('この端末の学習履歴を消します。\n\nNotion の「復習クイズ 学習記録」は消えないので、'
      + '次に開いたときにそこから戻ってきます。完全に消すには Notion 側の行も削除してください。\n\nよろしいですか？')) return;
    state = blankState();
    syncEpoch++;                 // 走っている同期の結果を無効にする
    logState.inflight = null;
    logState.status = 'idle';
    logState.pulled = logState.pushed = logState.pending = 0;
    try{ localStorage.removeItem(LS_KEY); }catch(e){ /* 消せなくてもメモリ上はリセット済み */ }
    saveState();
    renderSyncLine();
    renderHome();
  });

  // キーボード操作（PCで速く回す用）
  document.addEventListener('keydown', function(e){
    if($('screenQuiz').classList.contains('hidden')) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

    if(!locked && /^[1-6]$/.test(e.key)){
      var i = parseInt(e.key, 10) - 1;
      if(session && i < session.list[session.idx].options.length){ e.preventDefault(); answer(i); }
      return;
    }
    if(locked && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); next(); }
  });

  $('filePick').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{ boot(JSON.parse(String(rd.result))); }
      catch(err){ showError('選んだファイルを JSON として読めませんでした： ' + err.message); }
    };
    rd.onerror = function(){ showError('ファイルの読み込みに失敗しました。'); };
    rd.readAsText(f, 'utf-8');
  });
}

/* ============================================================
   12. 起動
   ============================================================ */
function showError(msg){
  $('errMsg').textContent = msg;
  goto('screenError');
}

/* 埋め込み分と Notion 分を合わせて、章の一覧を組み直す */
function applyQuestions(){
  QUESTIONS = EMBEDDED.concat(NOTION_Q);
  var chapSet = {};
  QUESTIONS.forEach(function(q){ chapSet[q.chapter] = true; });
  CHAPTERS = Object.keys(chapSet).map(Number).sort(function(a, b){ return a - b; });
  CHAPTER_TITLES = {};
  CHAPTERS.forEach(function(n){
    CHAPTER_TITLES[n] = EMB_TITLES[n] || DEFAULT_CHAPTER_TITLES[n] || '';
  });
}

function boot(raw){
  try{
    var r = parseData(raw);
    EMBEDDED     = r.list;
    EMB_TITLES   = r.titles;
    loadWarnings = r.warnings;
    RAW_DATA     = raw;
  }catch(e){
    showError(e.message);
    return;
  }
  if(loadWarnings.length){
    try{ console.warn('[quiz] 読み込めなかった問題:\n- ' + loadWarnings.join('\n- ')); }catch(_){}
  }
  applyQuestions();
  state = loadState();
  renderHome();
  goto('screenHome');
  loadNotion();   // 非同期。読めなくてもここまでで普通に使える
  syncLog();      // 学習記録の取り込みと、未送信ぶんの送信
}

function init(){
  applyTheme(loadTheme());
  wire();
  goto('screenLoading');

  /* アーティファクト版は問題データをページ内に持つ。その場合は fetch しない。 */
  var embedded = document.getElementById('quizData');
  if(embedded){
    try{ boot(JSON.parse(embedded.textContent)); return; }
    catch(e){ showError('埋め込まれた問題データを読めませんでした: ' + e.message); return; }
  }
  if(window.QUIZ_DATA){ boot(window.QUIZ_DATA); return; }

  fetch(DATA_URL, { cache:'no-cache' })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(boot)
    .catch(function(e){
      showError(String(e && e.message ? e.message : e));
    });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
