<title>データ基盤 復習クイズ</title>
<style id="appStyle">
/* ============================================================
   デザイントークン（ライト）
   ============================================================ */
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --card-2:#f8fafc;
  --fg:#16191d;
  --fg-soft:#3c454f;
  --muted:#68727e;
  --line:#e1e6ec;
  --line-strong:#cbd3dd;
  --accent:#1a66d6;
  --accent-fg:#ffffff;
  --accent-soft:#e8f0fd;
  --ok:#12704a;
  --ok-bg:#e4f4ec;
  --ok-line:#9ed3ba;
  --ng:#b3261e;
  --ng-bg:#fdeceb;
  --ng-line:#f0b1ad;
  --warn:#8a5a00;
  --warn-bg:#fdf4e3;
  --warn-line:#e8cf9a;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.07);
  --r:14px;
  --r-sm:10px;
  --tap:48px;
}
/* システム設定がダークのとき（手動でライト指定していなければ） */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318;
    --card:#171d24;
    --card-2:#1d242c;
    --fg:#eef2f6;
    --fg-soft:#c9d2dc;
    --muted:#95a1ae;
    --line:#2a333d;
    --line-strong:#3a4551;
    --accent:#6aa6ff;
    --accent-fg:#0b0f14;
    --accent-soft:#1a2634;
    --ok:#65d6a3;
    --ok-bg:#12291f;
    --ok-line:#2c5c45;
    --ng:#ff9a92;
    --ng-bg:#2c1715;
    --ng-line:#61302c;
    --warn:#e8bf72;
    --warn-bg:#2a2113;
    --warn-line:#5a4826;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
/* 手動でダーク指定したとき（システム設定より優先） */
:root[data-theme="dark"]{
  --bg:#0f1318;
  --card:#171d24;
  --card-2:#1d242c;
  --fg:#eef2f6;
  --fg-soft:#c9d2dc;
  --muted:#95a1ae;
  --line:#2a333d;
  --line-strong:#3a4551;
  --accent:#6aa6ff;
  --accent-fg:#0b0f14;
  --accent-soft:#1a2634;
  --ok:#65d6a3;
  --ok-bg:#12291f;
  --ok-line:#2c5c45;
  --ng:#ff9a92;
  --ng-bg:#2c1715;
  --ng-line:#61302c;
  --warn:#e8bf72;
  --warn-bg:#2a2113;
  --warn-line:#5a4826;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:anywhere;
  word-break:normal;
  line-break:strict;
}
button{font:inherit;color:inherit}
h1,h2,h3{line-height:1.4;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================================================
   レイアウト（375px 優先 / 中央寄せ）
   ============================================================ */
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:0 14px calc(28px + env(safe-area-inset-bottom));
}
.appbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  -webkit-backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
}
@supports not (backdrop-filter:blur(1px)){ .appbar{background:var(--bg)} }
.appbar-in{
  max-width:560px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
.brand{font-size:15px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.iconbtn{
  flex:none;width:40px;height:40px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1;
  box-shadow:var(--shadow-sm);
}
.iconbtn:active{transform:translateY(1px)}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:16px;
  margin-top:14px;
}
.card h2{font-size:14px;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:12px}
.hidden{display:none !important}

/* ============================================================
   ボタン
   ============================================================ */
.btn{
  display:flex;align-items:center;gap:10px;width:100%;
  min-height:var(--tap);
  padding:12px 14px;
  border-radius:var(--r-sm);
  border:1px solid var(--line-strong);
  background:var(--card);
  text-align:left;cursor:pointer;
  transition:background .12s, border-color .12s, transform .06s;
}
.btn:active{transform:translateY(1px)}
@media (hover:hover){ .btn:hover{background:var(--card-2);border-color:var(--accent)} }
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700;justify-content:center}
@media (hover:hover){ .btn-primary:hover{background:var(--accent);filter:brightness(1.08)} }
.btn-ghost{justify-content:center;font-weight:600}
.btn .ico{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:15px}
.btn .bodytxt{flex:1;min-width:0}
.btn .ttl{font-weight:700;font-size:15px;display:block}
.btn .sub{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:1px}
.btn .cnt{
  display:inline-block;margin-top:5px;
  font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--card-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;
}
.btn .cnt:empty{display:none}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}

/* ============================================================
   ホーム：統計
   ============================================================ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 6px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.stat.is-ng b{color:var(--ng)}
.stat.is-ok b{color:var(--ok)}

.chaplist{display:flex;flex-direction:column;gap:2px}
.chaprow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.chaprow:first-child{border-top:0}
.chaprow .no{flex:none;font-size:11px;font-weight:700;color:var(--muted);width:34px;font-variant-numeric:tabular-nums}
.chaprow .nm{flex:1;min-width:0;font-size:12.5px;color:var(--fg-soft);line-height:1.45}
.chaprow .pct{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);width:38px;text-align:right}
.meter{flex:none;width:62px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.good i{background:var(--ok)}
.meter.bad i{background:var(--ng)}

/* ============================================================
   クイズ画面
   ============================================================ */
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qcount{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
}
.chip.tag{background:transparent;color:var(--muted);border-color:var(--line-strong)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.chip.ng{background:var(--ng-bg);color:var(--ng);border-color:var(--ng-line)}

.qtext{font-size:17.5px;font-weight:700;line-height:1.65;margin:2px 0 14px;letter-spacing:.005em}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;
  min-height:var(--tap);
  padding:12px 13px;
  border:1.5px solid var(--line-strong);
  border-radius:var(--r-sm);
  background:var(--card);
  text-align:left;cursor:pointer;line-height:1.6;font-size:15px;
  transition:border-color .12s, background .12s, transform .06s;
}
.opt:active{transform:translateY(1px)}
@media (hover:hover){ .opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)} }
.opt .key{
  flex:none;width:25px;height:25px;border-radius:8px;
  background:var(--card-2);border:1px solid var(--line-strong);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);
  margin-top:1px;
}
.opt .txt{flex:1;min-width:0}
.opt .mark{flex:none;font-size:15px;font-weight:800;margin-top:1px;opacity:0}
.opt:disabled{cursor:default;opacity:1}
.opt.is-correct{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.is-correct .key{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.is-correct .mark{opacity:1;color:var(--ok)}
.opt.is-wrong{border-color:var(--ng-line);background:var(--ng-bg)}
.opt.is-wrong .key{background:var(--ng);border-color:var(--ng);color:var(--card)}
.opt.is-wrong .mark{opacity:1;color:var(--ng)}
.opt.is-dim{opacity:.5}

.verdict{
  margin-top:14px;padding:13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card-2);
}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.verdict.ng{background:var(--ng-bg);border-color:var(--ng-line)}
.verdict .vtop{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.verdict.ok .vtop{color:var(--ok)}
.verdict.ng .vtop{color:var(--ng)}
.verdict .exp{font-size:14.5px;line-height:1.75;color:var(--fg-soft)}
.backto{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);
  font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;
}

/* ============================================================
   結果画面
   ============================================================ */
.score{text-align:center;padding:6px 0 2px}
.score .big{font-size:46px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .big em{font-style:normal;font-size:22px;color:var(--muted);font-weight:700}
.score .pct{font-size:14px;color:var(--muted);margin-top:2px}
.score .msg{margin-top:10px;font-size:14.5px;font-weight:700}

.backchap{
  margin-top:14px;padding:13px;
  border-radius:var(--r-sm);border:1px solid var(--warn-line);background:var(--warn-bg);
}
.backchap .lbl{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--warn);margin-bottom:7px}
.backchap ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.backchap li{font-size:14px;line-height:1.6}
.backchap .cn{font-weight:800;display:block}
.backchap .tg{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}

.revlist{display:flex;flex-direction:column;gap:11px}
.rev{border:1px solid var(--line);border-left:3px solid var(--ng);border-radius:var(--r-sm);padding:11px 12px;background:var(--card-2)}
.rev .rq{font-size:14.5px;font-weight:700;line-height:1.6;margin-bottom:7px}
.rev .ans{font-size:13.5px;line-height:1.65}
.rev .ans .l{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;display:block}
.rev .ans .you{color:var(--ng)}
.rev .ans .cor{color:var(--ok);font-weight:700}
.rev .rexp{font-size:13px;color:var(--fg-soft);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-strong)}

.hist{display:flex;flex-direction:column;gap:1px}
.histrow{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);color:var(--fg-soft)}
.histrow:first-child{border-top:0}
.histrow .hw{flex:none;color:var(--muted);font-size:11.5px;width:78px;font-variant-numeric:tabular-nums}
.histrow .hm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histrow .hs{flex:none;font-weight:700;font-variant-numeric:tabular-nums}

/* ============================================================
   その他
   ============================================================ */
.notice{
  margin-top:14px;padding:11px 13px;border-radius:var(--r-sm);
  border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);
  font-size:12.5px;line-height:1.65;
}
.notice b{color:var(--warn)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 8px;line-height:1.8}
.muted{color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
code,kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--card-2);border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;font-size:.88em;
}
.err pre{
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px;overflow-x:auto;font-size:12.5px;margin:9px 0;line-height:1.6;
}
.err h2{color:var(--ng)}
.filepick{margin-top:12px;font-size:13px}
.filepick input{display:block;margin-top:7px;font-size:13px;max-width:100%}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* 問題を追加する画面 */
.ta{
  width:100%;min-height:190px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
  padding:11px;border-radius:var(--r-sm);
  border:1px solid var(--line-strong);background:var(--card-2);color:var(--fg);
}
.ta::placeholder{color:var(--muted);opacity:.8}
.result{margin-top:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card-2);font-size:13.5px;line-height:1.7}
.result.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.result.ng{background:var(--ng-bg);border-color:var(--ng-line)}
.result b{display:block;margin-bottom:5px}
.result.ok b{color:var(--ok)}
.result.ng b{color:var(--ng)}
.result ul{margin:6px 0 0;padding:0 0 0 18px}
.result li{margin:2px 0}
.steps{margin:0;padding:0 0 0 20px;font-size:13px;line-height:1.85;color:var(--fg-soft)}
.steps li{margin:0 0 4px}
.steps code{font-size:.85em}

@media (max-width:359px){
  body{font-size:15px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qtext{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>

nswer":2,"explanation":"データセットはリージョンを持ち、作成後に変更不可。別リージョン間の JOIN は不可。全部 asia-northeast1 に揃える理由。","addedAt":"2026-08-30"},{"id":8,"chapter":2,"tag":"#6","q":"BigQuery の「ジョブ」に含まれないものは？","options":["ロード","クエリ","エクスポート","データセット作成"],"answer":3,"explanation":"ジョブは load / query / extract / copy の4種。履歴は「ジョブ履歴」に6か月残る。","addedAt":"2026-08-30"},{"id":9,"chapter":2,"tag":"#7","q":"日次の取得ジョブ（load_table_from_dataframe）に maximum_bytes_billed を設定しても意味が無い理由は？","options":["ロードジョブには課金バイトが無い（無料）から","設定は BigQuery Studio でしかできないから","Python クライアントは非対応だから","無料トライアル中は設定不可だから"],"answer":0,"explanation":"課金バイトが付くのはクエリジョブだけ。上限は staging / mart を作るクエリと dbt profile に置く。","addedAt":"2026-08-30"},{"id":10,"chapter":2,"tag":"#7","q":"maximum_bytes_billed の判定タイミングは？","options":["クエリ完了後に実績値で判定し、超えていれば結果を破棄","実行前の見積もり（dry run 相当）と比較し、超えていれば実行しない","1時間ごとの集計で判定","課金締め日に判定"],"answer":1,"explanation":"実行前の見積もりで拒否する。だからコスト防御として唯一「確実」な層。キャッシュヒットは0バイト。","addedAt":"2026-08-30"},{"id":11,"chapter":2,"tag":"#7","q":"同じクエリを2回流したら2回目の課金バイトが 0 だった。理由は？","options":["2回目は無料枠が適用された","クエリ結果キャッシュに当たった","パーティションが効いた","BigQuery の不具合"],"answer":1,"explanation":"結果キャッシュヒットは課金 0。上限のテストをする時は --nouse_cache を付ける。","addedAt":"2026-08-30"},{"id":12,"chapter":2,"tag":"#20","q":"date 列でパーティションしたテーブルに対して、課金バイトが減らないクエリは？","options":["WHERE date >= '2026-08-01'","WHERE date BETWEEN '2026-08-01' AND '2026-08-31'","WHERE CAST(date AS STRING) LIKE '2026-08%'","WHERE date = CURRENT_DATE()"],"answer":2,"explanation":"パーティション列を関数で包んで文字列比較するとプルーニングが効かない。列そのものに条件を付ける。","addedAt":"2026-08-30"},{"id":13,"chapter":2,"tag":"#20","q":"既存の非パーティションテーブルをパーティション化する時、Terraform plan に出るものは？","options":["~ update in-place","-/+ forces replacement（作り直し）","変更なし","+ create のみ"],"answer":1,"explanation":"パーティション設定は作成時にしか付けられない属性。だから replace。データは消えるので、バックフィルで戻せる時だけ許可する。","addedAt":"2026-08-30"},{"id":14,"chapter":2,"tag":"#14","q":"日足の取得を WRITE_TRUNCATE にしてよい根拠は？","options":["BigQuery の推奨設定だから","毎回「直近1年を全量取り直す」設計なので、全部消して入れ直しても結果が同じ（冪等）だから","APPEND より速いから","無料枠が増えるから"],"answer":1,"explanation":"TRUNCATE が適するのは全量取り直せる時だけ。増分データや分足（60日しか遡れない）では使えない。","addedAt":"2026-08-30"},{"id":15,"chapter":2,"tag":"#14","q":"分足（yfinance は直近 60 日しか取れない）のロード方式として適切なのは？","options":["テーブル全体を WRITE_TRUNCATE","WRITE_APPEND で毎日追記","日付パーティション（table$YYYYMMDD）を指定して、その日だけ置き換える","毎回テーブルを DROP して CREATE"],"answer":2,"explanation":"全量が取り直せないので全体 TRUNCATE は不可。APPEND は再実行で重複。パーティション単位の置換なら冪等。","addedAt":"2026-08-30"},{"id":16,"chapter":2,"tag":"#15","q":"terraform plan が daily_prices の replace を提案した。直接原因は？","options":["Terraform のバージョンアップ","Python がロードのたびにスキーマを自動推定（autodetect）してテーブル定義を上書きし、宣言とズレた","BigQuery のメンテナンス","リージョンが変わった"],"answer":1,"explanation":"LoadJobConfig に schema を渡さないと毎回 DataFrame から推定→REQUIRED→NULLABLE 等にドリフト。対策は schema 明示。「構造は Terraform、中身は Python」。","addedAt":"2026-08-30"},{"id":17,"chapter":3,"tag":"#16","q":"Cloud Run の Service と Job の違いで正しいのは？","options":["Service はバッチ向け、Job は HTTP 常駐","Service は常駐して HTTP を受ける。Job は起動して処理し終了する","どちらも同じで課金だけ違う","Job は Docker イメージを使えない"],"answer":1,"explanation":"バッチは Job。AWS でいえば ECS Fargate の RunTask。定義（イメージ・SA）と実行（execution）が分かれる。","addedAt":"2026-08-30"},{"id":18,"chapter":3,"tag":"#16","q":"イメージを修正して push したが Job の動作が変わらない。最も考えられる原因は？","options":["Artifact Registry の反映に24時間かかる","Job 定義が古いタグ（v1）を指したまま。タグを更新して定義を apply する必要がある","Scheduler を再作成していない","SA の権限不足"],"answer":1,"explanation":"Job 定義はイメージのタグを固定で持つ。v2 に上げて Terraform で定義を更新する。","addedAt":"2026-08-30"},{"id":19,"chapter":3,"tag":"#18","q":"Cloud Scheduler から Cloud Run Job を起動する時、OAuth トークンを使う理由は？","options":["OIDC より安全だから","呼び先が Google API（run.googleapis.com）だから。自前の HTTP エンドポイントなら OIDC","Scheduler は OAuth しか対応していないから","無料枠で使えるのが OAuth だけだから"],"answer":1,"explanation":"Google API を呼ぶ＝OAuth、自前エンドポイント＝OIDC。SA に対象 Job の run.invoker が要る。","addedAt":"2026-08-30"},{"id":20,"chapter":3,"tag":"#18","q":"Scheduler の実行結果が 403。最初に疑うのは？","options":["cron の書式","Scheduler 用 SA に対象 Job の run.invoker が付いていない","URI のリージョン","タイムゾーン"],"answer":1,"explanation":"403＝権限。gcloud run jobs get-iam-policy で binding を確認。404 なら URI（プロジェクト・リージョン・Job 名）。","addedAt":"2026-08-30"},{"id":21,"chapter":3,"tag":"#16","q":"Dockerfile で requirements.txt を先に COPY してから pip install し、その後にコードを COPY する理由は？","options":["Python の仕様で順番が決まっている","コードだけ変えた時に pip install のレイヤーキャッシュが効き、ビルドが速いから","セキュリティのため","イメージサイズが小さくなるから"],"answer":1,"explanation":"レイヤーは上から順にキャッシュされる。変更頻度の低いものを先に置く。","addedAt":"2026-08-30"},{"id":22,"chapter":3,"tag":"#19","q":"FRED の API キーの置き場として適切なのは？","options":["Dockerfile の ENV","Terraform の .tf に平文","Secret Manager に置き、Job 定義から環境変数として参照する","Git リポジトリの .env"],"answer":2,"explanation":"イメージ・tfstate・Git に平文を置かない。Job の SA に secretmanager.secretAccessor が要る。","addedAt":"2026-08-30"},{"id":23,"chapter":3,"tag":"#16","q":"raw → staging → mart の順序制御を「時刻ずらし」で行う判断の代替案として、定石に近いのは？","options":["Cloud Composer（Airflow）や Workflows で依存関係を書く","全部1つの Job にまとめる","手動で順番に実行する","Cloud Functions を3つ並べる"],"answer":0,"explanation":"依存関係の明示は Composer / Workflows が定石。Composer は個人には課金が重い＝「なぜ使わなかったか」が設計判断メモになる。","addedAt":"2026-08-30"},{"id":24,"chapter":4,"tag":"#9","q":"Terraform と CloudFormation の決定的な違いは？","options":["Terraform は命令型","Terraform は state ファイルを自分で持ち、宣言・state・実体の3つを突き合わせる","CloudFormation は plan が無い","Terraform は AWS に使えない"],"answer":1,"explanation":"CloudFormation は状態を AWS が持つ。Terraform は tfstate。チームでは GCS 等に置きロックする。個人はローカル。","addedAt":"2026-08-30"},{"id":25,"chapter":4,"tag":"#9","q":"terraform plan の記号で「作り直し（データ消失の可能性）」を示すのは？","options":["+","~","-/+","="],"answer":2,"explanation":"+ 作成、~ その場で変更、-/+ replace。-/+ か destroy が出たら apply しない、が約束。","addedAt":"2026-08-30"},{"id":26,"chapter":4,"tag":"#15","q":"「ドリフト」の説明として正しいのは？","options":["Terraform のバージョン差","Terraform の外から実体が変更され、宣言（.tf）とズレること","state ファイルの破損","リージョン間のレイテンシ"],"answer":1,"explanation":"8/25・8/30 は Python がスキーマを書き換えたドリフト。Terraform は宣言を正として実体を戻そうとし、replace になる。","addedAt":"2026-08-30"},{"id":27,"chapter":4,"tag":"#9","q":"個人ポートフォリオで tfstate をローカルに置く判断を面接で説明する時、添えるべき定石は？","options":["state は常にローカルが推奨","チームでは GCS などのリモートバックエンドに置き、ロックで同時実行を防ぐのが定石","state は Git にコミットするのが定石","state は不要"],"answer":1,"explanation":"「単一端末・個人なのでローカル。本番ならリモート＋ロック」と言える＝代替案と理由。","addedAt":"2026-08-30"},{"id":28,"chapter":5,"tag":"#10","q":"raw 層の定義として最も正確なのは？","options":["自動取得したデータを置く層","加工前のまま置く、パイプラインでこれ以上遡れない入力の境界","集計済みデータを置く層","一時ファイル置き場"],"answer":1,"explanation":"手動投入の銘柄マスタも raw。「取得元が何か」ではなく「これ以上遡れないか」で決まる。","addedAt":"2026-08-30"},{"id":29,"chapter":5,"tag":"#13","q":"yfinance で auto_adjust=False にした理由は？","options":["True だと取得が遅いから","調整済み値が raw に入ると『調整後終値を自分で再計算する』見せ場が成立せず、raw 原則にも反するから","False がデフォルトだから","Terraform の設定と合わせるため"],"answer":1,"explanation":"0.2.28 以降デフォルトが True になり OHLC が調整済みに書き換わり Adj Close 列が消える。raw は加工前のまま。","addedAt":"2026-08-30"},{"id":30,"chapter":5,"tag":"#11","q":"失敗したジョブを「再実行してよい」と判断できる条件は？","options":["エラーメッセージが短い","前回の実行から24時間以上経過","処理が冪等（2回流しても結果が同じ）で、途中まで書かれた状態が残らない","担当者の承認がある"],"answer":2,"explanation":"TRUNCATE・パーティション置換・CREATE OR REPLACE は冪等。APPEND は重複するので不可。DATUM Ops の『再実行判断』の中身。","addedAt":"2026-08-30"},{"id":31,"chapter":5,"tag":"as-of","q":"四半期決算を日次価格に結合する時、fiscal_period_end（期末日）ではなく filed_date（提出日）で結ぶ理由は？","options":["期末日は欠損が多いから","期末日で結ぶと、まだ公開されていない情報を過去の日に付けてしまう（ルックアヘッド）から","提出日の方が JOIN が速いから","SEC の仕様で期末日が取れないから"],"answer":1,"explanation":"as-of ジョイン＝その日時点で知り得た最新値。filed_date <= date で絞り最新1件を QUALIFY で取る。","addedAt":"2026-08-30"},{"id":32,"chapter":5,"tag":"品質","q":"合成データではなく実データを使う理由として本ポートフォリオが挙げたのは？","options":["合成データは生成に時間がかかる","合成データだと品質テストが自作自演になり、検証可能性を示せない","実データの方が量が多い","BigQuery は合成データを禁止している"],"answer":1,"explanation":"実データには本物の欠損（外国籍の us-gaap 欠落、FRED の \".\"、Yahoo との不一致）がある。検知して落とさず記録する。","addedAt":"2026-08-30"},{"id":33,"chapter":5,"tag":"#11","q":"「今日のデータが来ていない」を検知する仕組みとして、失敗通知の経路に自然に乗る方法は？","options":["毎朝手で SELECT する","mart ジョブの最後に ASSERT MAX(date) >= … を置き、条件を満たさなければジョブを失敗させる","Looker Studio を見る","予算アラートで気づく"],"answer":1,"explanation":"鮮度・品質は ASSERT でジョブ失敗に変換すると、失敗アラートと同じ通知経路で届く。","addedAt":"2026-08-30"},{"id":34,"chapter":6,"tag":"#7","q":"予算アラート（月3,000円）について正しいのは？","options":["超えたらクエリが止まる","超えたら通知が来るだけで課金は止まらない","超えたらプロジェクトが停止する","無料枠が増える"],"answer":1,"explanation":"通知のみ。止めるのは maximum_bytes_billed（実行前）とカスタム割り当て（有料化後）。","addedAt":"2026-08-30"},{"id":35,"chapter":6,"tag":"#12","q":"有料化（11/1）の直後に必ずやることは？","options":["リージョン変更","BigQuery のカスタム割り当て（1日の課金バイト上限）を設定する","SA の再作成","Scheduler の再作成"],"answer":1,"explanation":"トライアル中は「$300 で停止」が実質ハードリミット。有料化でそれが外れるので、カスタム割り当てで代替する（トライアル中は Adjustable=No）。","addedAt":"2026-08-30"},{"id":36,"chapter":6,"tag":"#7","q":"コスト防御3層のうち「実行前に確実に止まる」のは？","options":["予算アラート","カスタム割り当て","maximum_bytes_billed","Looker Studio の閲覧制限"],"answer":2,"explanation":"割り当ては公式に『おおよその値』。予算は通知のみ。クエリ単位の上限だけが見積もり段階で拒否する。","addedAt":"2026-08-30"},{"id":37,"chapter":7,"tag":"設計","q":"「なぜ Airflow / Cloud Composer を使わなかったか」への答えとして一貫しているのは？","options":["Airflow を知らないから","Composer は常駐課金が重く無料枠で回らない。ジョブ3本の順序は時刻ずらしで足りる。実務で依存が複雑になれば Workflows / Composer に移す","Airflow は GCP で使えないから","Cloud Run の方が新しいから"],"answer":1,"explanation":"採らなかった選択肢＋理由＋採った案の弱点＋実務ならどう変えるか、の4点が言えれば合格。","addedAt":"2026-08-30"},{"id":38,"chapter":7,"tag":"設計","q":"dbt を mart 層だけに入れた判断の説明として筋が通るのは？","options":["dbt は raw 層に使えない","raw は Python のロード、staging は素の SQL で十分。変換ロジックが集中し、テスト（not_null/unique/一致率）が効くのは mart だから","dbt は無料枠外だから","staging は存在しないから"],"answer":1,"explanation":"dbt の価値は ref による依存管理とテスト。価値が出る層に絞る＝Be Lazy。","addedAt":"2026-08-30"}]</script>

<div id="root"></div>
<script id="appScript">
(function(){
'use strict';

/* ============================================================
   0. 定数
   ============================================================ */
var DATA_URL   = 'quiz-data.json';
var LS_KEY     = 'gcpQuiz.v1';
var LS_THEME   = 'gcpQuiz.theme';
var PICK_N     = 10;          // 「全範囲」「最近追加」の出題数
var HIST_MAX   = 20;          // 保存するセッション履歴の件数
var SESS_MAX   = 60;          // 1セッションの最大出題数（章別が巨大化したときの保険）

/* 章タイトルの既定値。quiz-data.json が {chapters:{...},questions:[...]} 形式なら
   そちらが優先される。未知の章番号は「第N章」と表示するので、
   章を増やしてもコード変更は不要。 */
var DEFAULT_CHAPTER_TITLES = {
  1:'GCP の骨格',
  2:'BigQuery',
  3:'動かす側',
  4:'Terraform',
  5:'データ基盤の考え方',
  6:'コストの3層',
  7:'このポートフォリオに当てはめると'
};

var LETTERS = ['A','B','C','D','E','F'];

/* アーティファクト版では、本文の元マークアップを #bodyTpl に持たせ、
   毎回そこから描き直す。こうしておくと、画面を操作したあとの状態が
   保存される版に混ざり込まない（保存時は必ず「元の形＋新しいデータ」になる）。 */
(function renderFromTemplate(){
  var tpl = document.getElementById('bodyTpl');
  var root = document.getElementById('root');
  if(tpl && root && !root.firstChild) root.innerHTML = tpl.textContent;
})();

/* ============================================================
   1. DOM ヘルパ
   ============================================================ */
function $(id){ return document.getElementById(id); }
function show(el){ el.classList.remove('hidden'); }
function hide(el){ el.classList.add('hidden'); }
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt !== undefined && txt !== null) n.textContent = String(txt);
  return n;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

/* ============================================================
   2. localStorage（すべて try/catch）
   ============================================================ */
var storageOK = true;

function blankState(){ return { version:1, stats:{}, sessions:[] }; }

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return blankState();
    var p = JSON.parse(raw);
    if(!p || typeof p !== 'object') return blankState();
    return {
      version : 1,
      stats   : (p.stats && typeof p.stats === 'object') ? p.stats : {},
      sessions: Array.isArray(p.sessions) ? p.sessions : []
    };
  }catch(e){
    storageOK = false;
    try{ console.warn('[quiz] 履歴の読み込みに失敗しました:', e); }catch(_){}
    return blankState();
  }
}

function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    if(!storageOK){ storageOK = true; hide($('storageWarn')); }
  }catch(e){
    storageOK = false;
    try{ console.warn('[quiz] 履歴の保存に失敗しました:', e); }catch(_){}
    var w = $('storageWarn'); if(w) show(w);
  }
}

function loadTheme(){
  try{ return localStorage.getItem(LS_THEME) || 'auto'; }
  catch(e){ return 'auto'; }
}
function saveTheme(v){
  try{ localStorage.setItem(LS_THEME, v); }catch(e){ /* 保存できなくても動作は継続 */ }
}

/* ============================================================
   3. 問題データの読み込みと正規化
   ============================================================ */
var QUESTIONS = [];          // 正規化済みの全問題
var RAW_DATA  = null;        // 読み込んだ生データ（問題を追加するときにこれへ足す）
var CHAPTER_TITLES = {};     // 章番号 -> タイトル
var CHAPTERS = [];           // 出現する章番号（昇順）
var loadWarnings = [];

function hashId(str){
  var h = 5381, i;
  for(i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) | 0; }
  return 'auto-' + (h >>> 0).toString(36);
}

/* answer は 0 始まりのインデックスが正。
   移植のしやすさのため、選択肢そのものの文字列 / "A"〜"D" / 数値文字列も受け付ける。 */
function normAnswer(a, options){
  var i, t, n;
  if(typeof a === 'number' && a >= 0 && a < options.length && a === Math.floor(a)) return a;
  if(typeof a === 'string'){
    i = options.indexOf(a);
    if(i >= 0) return i;
    t = a.trim();
    if(/^[A-Fa-f]$/.test(t)){
      i = LETTERS.indexOf(t.toUpperCase());
      if(i >= 0 && i < options.length) return i;
    }
    n = Number(t);
    if(!isNaN(n) && n === Math.floor(n)){
      if(n >= 0 && n < options.length) return n;
    }
  }
  return -1;
}

/* 貼り付けられたJSONを、いまのデータに触れずに検証するため副作用なしにしてある。
   グローバルへ反映するのは下の normalize()。 */
function parseData(raw){
  var list = [];
  var chapTitles = {};
  var seen = {};
  var warnings = [];

  var arr;
  if(Array.isArray(raw)){
    arr = raw;
  }else if(raw && Array.isArray(raw.questions)){
    arr = raw.questions;
    if(raw.chapters && typeof raw.chapters === 'object'){
      for(var k in raw.chapters){
        if(Object.prototype.hasOwnProperty.call(raw.chapters, k)) chapTitles[String(k)] = String(raw.chapters[k]);
      }
    }
  }else{
    throw new Error('quiz-data.json は配列、または {"chapters":{...},"questions":[...]} である必要があります。');
  }

  for(var i = 0; i < arr.length; i++){
    var r = arr[i];
    if(!r || typeof r !== 'object'){ warnings.push((i+1) + '件目: オブジェクトではありません'); continue; }

    var qtext = (typeof r.q === 'string') ? r.q.trim() : '';
    if(!qtext){ warnings.push((i+1) + '件目: q（問題文）がありません'); continue; }

    if(!Array.isArray(r.options) || r.options.length < 2){
      warnings.push((i+1) + '件目: options が2つ以上の配列ではありません（' + qtext.slice(0,18) + '…）');
      continue;
    }
    var options = r.options.slice(0, LETTERS.length).map(function(o){ return String(o); });

    var ans = normAnswer(r.answer, options);
    if(ans < 0){
      warnings.push((i+1) + '件目: answer が選択肢を指していません（' + qtext.slice(0,18) + '…）');
      continue;
    }

    var id = (r.id === 0 || r.id) ? String(r.id) : hashId(qtext);
    if(seen[id]){
      warnings.push('id "' + id + '" が重複しています。後ろの1件を無視しました。');
      continue;
    }
    seen[id] = true;

    var ch = parseInt(r.chapter, 10);
    if(isNaN(ch)) ch = 0;

    /* 数字だけの tag（"12"）には # を補う。"as-of" のような語のタグはそのまま扱う。 */
    var tag = (r.tag === 0 || r.tag) ? String(r.tag).trim() : '';
    if(tag && tag.charAt(0) !== '#' && /^[0-9]+$/.test(tag)) tag = '#' + tag;

    list.push({
      id        : id,
      chapter   : ch,
      tag       : tag,
      q         : qtext,
      options   : options,
      answer    : ans,
      explanation: (typeof r.explanation === 'string') ? r.explanation : '',
      addedAt   : (typeof r.addedAt === 'string') ? r.addedAt : ''
    });
  }

  if(!list.length) throw new Error('有効な問題が1問もありませんでした。データの形式を確認してください。');

  var chapSet = {};
  list.forEach(function(q){ chapSet[q.chapter] = true; });
  var chapters = Object.keys(chapSet).map(Number).sort(function(a, b){ return a - b; });

  var titles = {};
  chapters.forEach(function(n){
    titles[n] = chapTitles[String(n)] || DEFAULT_CHAPTER_TITLES[n] || '';
  });

  return { list:list, warnings:warnings, chapters:chapters, titles:titles };
}

/* parseData の結果をアプリのグローバルに反映する */
function normalize(raw){
  var r = parseData(raw);
  loadWarnings    = r.warnings;
  CHAPTERS        = r.chapters;
  CHAPTER_TITLES  = r.titles;
  return r.list;
}

function chapterLabel(n){
  if(!n) return '章未設定';
  return '第' + n + '章';
}
function chapterFull(n){
  var t = CHAPTER_TITLES[n];
  return t ? (chapterLabel(n) + ' ' + t) : chapterLabel(n);
}

/* ============================================================
   4. 状態
   ============================================================ */
var state   = blankState();
var session = null;   // { mode, label, chapter, list, idx, answers:[] }

function statOf(id){
  var s = state.stats[id];
  if(!s || typeof s !== 'object') return null;
  return s;
}
/* 'wrong' = 直近で不正解 / 'new' = 未挑戦 / 'ok' = 直近で正解 */
function statusOf(id){
  var s = statOf(id);
  if(!s || !s.seen) return 'new';
  return s.last === 'wrong' ? 'wrong' : 'ok';
}
function accuracyOf(id){
  var s = statOf(id);
  if(!s || !s.seen) return -1;
  return s.correct / s.seen;
}

function recordAnswer(q, ok){
  var s = state.stats[q.id];
  if(!s || typeof s !== 'object') s = { seen:0, correct:0, wrong:0, last:null, lastAt:null };
  s.seen    = (s.seen | 0) + 1;
  s.correct = (s.correct | 0) + (ok ? 1 : 0);
  s.wrong   = (s.wrong | 0) + (ok ? 0 : 1);
  s.last    = ok ? 'correct' : 'wrong';
  s.lastAt  = new Date().toISOString();
  state.stats[q.id] = s;
  saveState();
}

/* ============================================================
   5. 出題ロジック
   ============================================================ */
function shuffle(a){
  var arr = a.slice(), i, j, t;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* 間違い優先の並び替え：間違い → 未挑戦 → 正解済み（正解済みは正答率の低い順） */
function prioritize(list){
  var wrong = [], fresh = [], done = [];
  list.forEach(function(q){
    var st = statusOf(q.id);
    if(st === 'wrong') wrong.push(q);
    else if(st === 'new') fresh.push(q);
    else done.push(q);
  });
  done = shuffle(done).sort(function(a,b){ return accuracyOf(a.id) - accuracyOf(b.id); });
  return shuffle(wrong).concat(shuffle(fresh), done);
}

/* 選択肢を毎回シャッフルして返す（元の問題オブジェクトは書き換えない）。
   元データは正解が特定の位置に偏りがちで、「迷ったらB」で当たってしまうため。
   解説が選択肢を位置で参照していると壊れるので、解説は内容で指す書き方にすること。 */
function withShuffledOptions(q){
  var order = shuffle(q.options.map(function(_, i){ return i; }));
  return {
    id:q.id, chapter:q.chapter, tag:q.tag, q:q.q,
    options: order.map(function(i){ return q.options[i]; }),
    answer: order.indexOf(q.answer),
    explanation:q.explanation, addedAt:q.addedAt
  };
}

function poolAll(){ return QUESTIONS; }
function poolChapter(n){ return QUESTIONS.filter(function(q){ return q.chapter === n; }); }
function poolWrong(){ return QUESTIONS.filter(function(q){ return statusOf(q.id) === 'wrong'; }); }
function poolRecent(){
  return QUESTIONS.slice().sort(function(a,b){
    if(a.addedAt !== b.addedAt) return a.addedAt < b.addedAt ? 1 : -1;  // 降順・空文字は最後
    return a.id < b.id ? 1 : (a.id > b.id ? -1 : 0);
  });
}

function buildSession(mode, chapter){
  var list, label;
  if(mode === 'all'){
    list  = prioritize(poolAll()).slice(0, PICK_N);
    label = '全範囲 ' + list.length + '問';
  }else if(mode === 'chapter'){
    list  = prioritize(poolChapter(chapter)).slice(0, SESS_MAX);
    label = chapterLabel(chapter);
  }else if(mode === 'wrong'){
    list  = prioritize(poolWrong()).slice(0, SESS_MAX);
    label = '間違いのみ';
  }else if(mode === 'recent'){
    list  = poolRecent().slice(0, PICK_N);
    label = '最近追加された問題';
  }else{
    list = []; label = '';
  }
  return { mode:mode, chapter:(chapter === undefined ? null : chapter), label:label,
           list:list.map(withShuffledOptions), idx:0, answers:[] };
}

/* ============================================================
   6. 画面遷移
   ============================================================ */
var SCREENS = ['screenLoading','screenError','screenHome','screenQuiz','screenResult','screenAdd'];
function goto(name){
  SCREENS.forEach(function(s){
    var n = $(s);
    if(!n) return;
    if(s === name) show(n); else hide(n);
  });
  if(name === 'screenQuiz' || name === 'screenResult' || name === 'screenAdd') show($('homeBtn')); else hide($('homeBtn'));
  $('brandSub').textContent = (name === 'screenQuiz' && session) ? session.label : 'ポートフォリオ復習用';
  window.scrollTo(0, 0);
}

/* ============================================================
   7. ホーム画面の描画
   ============================================================ */
function renderHome(){
  var total = QUESTIONS.length;
  var seen = 0, corr = 0, wrongNow = 0;
  QUESTIONS.forEach(function(q){
    var st = statusOf(q.id);
    if(st !== 'new'){ seen++; if(st === 'ok') corr++; else wrongNow++; }
  });

  $('stTotal').textContent = total;
  $('stSeen').textContent  = seen;
  $('stAcc').textContent   = seen ? (Math.round(corr / seen * 100) + '%') : '–';
  $('stWrong').textContent = wrongNow;

  if(!storageOK) show($('storageWarn'));

  // データの警告
  var dw = $('dataWarn');
  if(loadWarnings.length){
    clear(dw);
    dw.appendChild(el('b', null, '読み込めなかった問題が ' + loadWarnings.length + ' 件あります。'));
    dw.appendChild(document.createTextNode(' 詳細はブラウザのコンソールに出しています。'));
    var ul = el('ul'); ul.style.margin = '6px 0 0'; ul.style.padding = '0 0 0 18px';
    loadWarnings.slice(0, 5).forEach(function(w){ ul.appendChild(el('li', null, w)); });
    if(loadWarnings.length > 5) ul.appendChild(el('li', null, 'ほか ' + (loadWarnings.length - 5) + ' 件'));
    dw.appendChild(ul);
    show(dw);
  }else{
    hide(dw);
  }

  // モードごとの件数
  var nWrong = poolWrong().length;
  var nNew   = QUESTIONS.filter(function(q){ return statusOf(q.id) === 'new'; }).length;
  $('cntAll').textContent    = '間違い ' + nWrong + ' / 未挑戦 ' + nNew;
  $('cntWrong').textContent  = nWrong + '問';
  $('cntRecent').textContent = Math.min(PICK_N, total) + '問';
  $('modeWrong').disabled = (nWrong === 0);

  // 章別ボタン
  var cb = $('chapBtns');
  clear(cb);
  CHAPTERS.forEach(function(n){
    var pool = poolChapter(n);
    var w = pool.filter(function(q){ return statusOf(q.id) === 'wrong'; }).length;
    var b = el('button', 'btn');
    b.type = 'button';
    var ico = el('span', 'ico', String(n || '?')); ico.setAttribute('aria-hidden','true');
    b.appendChild(ico);
    var body = el('span', 'bodytxt');
    body.appendChild(el('span', 'ttl', chapterLabel(n)));
    body.appendChild(el('span', 'sub', CHAPTER_TITLES[n] || '（タイトル未設定）'));
    body.appendChild(el('span', 'cnt', pool.length + '問' + (w ? '　要復習 ' + w : '')));
    b.appendChild(body);
    b.addEventListener('click', function(){ startSession('chapter', n); });
    cb.appendChild(b);
  });

  // 章別の理解度
  var cs = $('chapStats');
  clear(cs);
  CHAPTERS.forEach(function(n){
    var pool = poolChapter(n);
    var s = 0, c = 0;
    pool.forEach(function(q){
      var st = statusOf(q.id);
      if(st !== 'new'){ s++; if(st === 'ok') c++; }
    });
    var pct = s ? Math.round(c / s * 100) : null;
    var row = el('div', 'chaprow');
    row.appendChild(el('span', 'no', chapterLabel(n)));
    row.appendChild(el('span', 'nm', CHAPTER_TITLES[n] || '—'));
    var m = el('span', 'meter' + (pct === null ? '' : (pct >= 80 ? ' good' : (pct < 50 ? ' bad' : ''))));
    m.setAttribute('role', 'img');
    m.setAttribute('aria-label', pct === null ? '未挑戦' : ('正答率 ' + pct + '%'));
    var fill = el('i'); fill.style.width = (pct === null ? 0 : pct) + '%';
    m.appendChild(fill);
    row.appendChild(m);
    row.appendChild(el('span', 'pct', pct === null ? '–' : pct + '%'));
    cs.appendChild(row);
  });

  // セッション履歴
  var hl = $('histList');
  clear(hl);
  if(!state.sessions.length){
    hide($('histCard'));
  }else{
    show($('histCard'));
    state.sessions.slice(0, HIST_MAX).forEach(function(h){
      var row = el('div', 'histrow');
      row.appendChild(el('span', 'hw', fmtWhen(h.at)));
      row.appendChild(el('span', 'hm', h.label || ''));
      row.appendChild(el('span', 'hs', h.correct + '/' + h.total));
      hl.appendChild(row);
    });
  }
}

function fmtWhen(iso){
  try{
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var mm = d.getMonth() + 1, dd = d.getDate();
    var hh = ('0' + d.getHours()).slice(-2), mi = ('0' + d.getMinutes()).slice(-2);
    return mm + '/' + dd + ' ' + hh + ':' + mi;
  }catch(e){ return ''; }
}

/* ============================================================
   8. クイズ画面
   ============================================================ */
var locked = false;

function startSession(mode, chapter){
  var s = buildSession(mode, chapter);
  if(!s.list.length){
    window.alert(mode === 'wrong'
      ? '間違えた問題はまだありません。まずは全範囲から解いてみてください。'
      : '出題できる問題がありませんでした。');
    return;
  }
  session = s;
  goto('screenQuiz');
  renderQuestion();
}

function renderQuestion(){
  locked = false;
  var q = session.list[session.idx];
  var n = session.idx + 1, total = session.list.length;

  $('qCount').textContent = n + ' / ' + total;
  $('qBar').style.width = Math.round((session.idx / total) * 100) + '%';
  var got = session.answers.filter(function(a){ return a.ok; }).length;
  $('qScore').textContent = got + '問正解';

  var chapChip = $('qChapter');
  chapChip.textContent = chapterFull(q.chapter);
  var tagChip = $('qTag');
  if(q.tag){ tagChip.textContent = '理解度表 ' + q.tag; show(tagChip); } else { hide(tagChip); }

  $('qText').textContent = q.q;

  var box = $('qOpts');
  clear(box);
  q.options.forEach(function(opt, i){
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('data-i', String(i));
    b.appendChild(el('span', 'key', LETTERS[i]));
    b.appendChild(el('span', 'txt', opt));
    var mark = el('span', 'mark', ''); mark.setAttribute('aria-hidden','true');
    b.appendChild(mark);
    b.addEventListener('click', function(){ answer(i); });
    box.appendChild(b);
  });

  hide($('qVerdict'));
  hide($('qNextWrap'));
  $('nextBtn').textContent = (session.idx === total - 1) ? '結果を見る' : '次の問題へ';
}

function answer(i){
  if(locked) return;
  locked = true;

  var q  = session.list[session.idx];
  var ok = (i === q.answer);

  session.answers.push({ id:q.id, chapter:q.chapter, tag:q.tag, picked:i, ok:ok });
  recordAnswer(q, ok);

  // 選択肢の見た目を更新
  var btns = $('qOpts').querySelectorAll('.opt');
  Array.prototype.forEach.call(btns, function(b, bi){
    b.disabled = true;
    if(bi === q.answer){
      b.classList.add('is-correct');
      b.querySelector('.mark').textContent = '✓';
      b.appendChild(el('span', 'sr', '（これが正解）'));
    }else if(bi === i){
      b.classList.add('is-wrong');
      b.querySelector('.mark').textContent = '✕';
      b.appendChild(el('span', 'sr', '（あなたの解答・不正解）'));
    }else{
      b.classList.add('is-dim');
    }
  });

  // 判定 + 解説（chapter と tag を必ず出す）
  var v = $('qVerdict');
  clear(v);
  v.className = 'verdict ' + (ok ? 'ok' : 'ng');
  var top = el('div', 'vtop');
  top.appendChild(el('span', null, ok ? '◎ 正解' : '✕ 不正解'));
  if(!ok) top.appendChild(el('span', 'muted', '正解は ' + LETTERS[q.answer]));
  v.appendChild(top);

  if(q.explanation) v.appendChild(el('div', 'exp', q.explanation));

  var back = el('div', 'backto');
  back.appendChild(el('span', null, '戻る先：'));
  back.appendChild(el('span', 'chip', chapterFull(q.chapter)));
  if(q.tag) back.appendChild(el('span', 'chip tag', '理解度表 ' + q.tag));
  v.appendChild(back);

  show(v);
  show($('qNextWrap'));

  var got = session.answers.filter(function(a){ return a.ok; }).length;
  $('qScore').textContent = got + '問正解';
  $('qBar').style.width = Math.round(((session.idx + 1) / session.list.length) * 100) + '%';

  $('nextBtn').focus({ preventScroll:true });
  try{ v.scrollIntoView({ behavior:'smooth', block:'nearest' }); }catch(e){ /* 古いブラウザは無視 */ }
}

function next(){
  if(!locked) return;
  if(session.idx < session.list.length - 1){
    session.idx++;
    renderQuestion();
    window.scrollTo(0, 0);
  }else{
    finish();
  }
}

/* ============================================================
   9. 結果画面
   ============================================================ */
function finish(){
  var total = session.answers.length;
  var corr  = session.answers.filter(function(a){ return a.ok; }).length;

  // 章別集計
  var per = {};
  session.answers.forEach(function(a){
    var k = a.chapter;
    if(!per[k]) per[k] = { total:0, correct:0, wrongTags:[] };
    per[k].total++;
    if(a.ok){ per[k].correct++; }
    else if(a.tag && per[k].wrongTags.indexOf(a.tag) < 0){ per[k].wrongTags.push(a.tag); }
  });

  // 履歴に保存
  var rec = { at:new Date().toISOString(), mode:session.mode, label:session.label, total:total, correct:corr };
  state.sessions.unshift(rec);
  if(state.sessions.length > HIST_MAX) state.sessions.length = HIST_MAX;
  saveState();

  // スコア
  $('rsCorrect').textContent = corr;
  $('rsTotal').textContent   = total;
  var pct = total ? Math.round(corr / total * 100) : 0;
  $('rsPct').textContent = '正答率 ' + pct + '%　（' + session.label + '）';
  $('rsMsg').textContent =
    pct === 100 ? '全問正解。次の章に進んでOK。' :
    pct >= 80   ? 'いい感じ。間違えた分だけ章に戻ろう。' :
    pct >= 50   ? '半分は取れている。下の「戻る章」を読み直そう。' :
                  'ここは基礎知識ノートに戻る合図。焦らず読み直そう。';

  // 「戻る章」＝間違いのあった章を、正答率の低い順に
  var backs = Object.keys(per)
    .map(function(k){
      var p = per[k];
      return { ch:Number(k), total:p.total, correct:p.correct, rate:p.correct / p.total, tags:p.wrongTags };
    })
    .filter(function(x){ return x.correct < x.total; })
    .sort(function(a,b){ return a.rate - b.rate || b.total - a.total; });

  var bc = $('rsBackChap');
  clear(bc);
  if(backs.length){
    var box = el('div', 'backchap');
    box.appendChild(el('div', 'lbl', '戻る章（基礎知識ノート）'));
    var ul = el('ul');
    backs.forEach(function(x){
      var li = el('li');
      li.appendChild(el('span', 'cn', chapterFull(x.ch)));
      li.appendChild(document.createTextNode(
        x.correct + ' / ' + x.total + '問正解　→ ' + (x.total - x.correct) + '問を復習'));
      if(x.tags.length){
        var tg = el('div', 'tg');
        tg.appendChild(el('span', null, '見直す項目：'));
        x.tags.forEach(function(t){ tg.appendChild(el('span', 'chip tag', t)); });
        li.appendChild(tg);
      }
      ul.appendChild(li);
    });
    box.appendChild(ul);
    bc.appendChild(box);
  }else{
    var okbox = el('div', 'backchap');
    okbox.style.borderColor = 'var(--ok-line)';
    okbox.style.background  = 'var(--ok-bg)';
    var lbl = el('div', 'lbl', '戻る章はありません');
    lbl.style.color = 'var(--ok)';
    okbox.appendChild(lbl);
    okbox.appendChild(el('div', null, 'このセッションは全問正解でした。新しい章へ進みましょう。'));
    bc.appendChild(okbox);
  }

  // 章別スコア
  var cs = $('rsChapters');
  clear(cs);
  Object.keys(per).map(Number).sort(function(a,b){ return a - b; }).forEach(function(n){
    var p = per[n];
    var rate = Math.round(p.correct / p.total * 100);
    var row = el('div', 'chaprow');
    row.appendChild(el('span', 'no', chapterLabel(n)));
    row.appendChild(el('span', 'nm', CHAPTER_TITLES[n] || '—'));
    var m = el('span', 'meter' + (rate >= 80 ? ' good' : (rate < 50 ? ' bad' : '')));
    var f = el('i'); f.style.width = rate + '%'; m.appendChild(f);
    row.appendChild(m);
    row.appendChild(el('span', 'pct', p.correct + '/' + p.total));
    cs.appendChild(row);
  });

  // 間違えた問題の振り返り
  var rv = $('rsReview');
  clear(rv);
  var wrongs = session.answers.filter(function(a){ return !a.ok; });
  if(!wrongs.length){
    hide($('rsReviewCard'));
  }else{
    show($('rsReviewCard'));
    wrongs.forEach(function(a){
      var q = null, i;
      for(i = 0; i < session.list.length; i++){ if(session.list[i].id === a.id){ q = session.list[i]; break; } }
      if(!q) return;
      var box = el('div', 'rev');
      var chips = el('div', 'chips');
      chips.appendChild(el('span', 'chip', chapterFull(q.chapter)));
      if(q.tag) chips.appendChild(el('span', 'chip tag', '理解度表 ' + q.tag));
      box.appendChild(chips);
      box.appendChild(el('div', 'rq', q.q));
      var ans = el('div', 'ans');
      var l1 = el('span', 'l', 'あなたの解答');
      ans.appendChild(l1);
      ans.appendChild(el('span', 'you', LETTERS[a.picked] + '. ' + q.options[a.picked]));
      ans.appendChild(el('br'));
      var l2 = el('span', 'l', '正解'); l2.style.marginTop = '6px';
      ans.appendChild(l2);
      ans.appendChild(el('span', 'cor', LETTERS[q.answer] + '. ' + q.options[q.answer]));
      box.appendChild(ans);
      if(q.explanation) box.appendChild(el('div', 'rexp', q.explanation));
      rv.appendChild(box);
    });
  }

  var rwBtn = $('retryWrongBtn');
  rwBtn.disabled = (poolWrong().length === 0);

  goto('screenResult');
}

/* ============================================================
   9.5 問題の追加（貼り付け → 検証 → 保存）
   ============================================================ */
var addPending = null;   // 保存待ちの「追記後の全データ」

/* 生データの形（配列 / {chapters,questions}）を保ったまま問題を足す */
function mergeRaw(raw, incoming, chapters){
  var k;
  if(Array.isArray(raw) && !chapters) return raw.concat(incoming);
  var copy = {};
  if(!Array.isArray(raw)){ for(k in raw){ if(Object.prototype.hasOwnProperty.call(raw, k)) copy[k] = raw[k]; } }
  copy.questions = (Array.isArray(raw) ? raw : (raw.questions || [])).concat(incoming);
  if(chapters){
    var merged = {};
    var cur = Array.isArray(raw) ? {} : (raw.chapters || {});
    for(k in cur){ if(Object.prototype.hasOwnProperty.call(cur, k)) merged[k] = cur[k]; }
    for(k in chapters){ if(Object.prototype.hasOwnProperty.call(chapters, k)) merged[k] = String(chapters[k]); }
    copy.chapters = merged;
  }
  return copy;
}

/* ファイルに貼り戻しやすい形（1問1行）で書き出す */
function formatData(raw){
  if(Array.isArray(raw)){
    return '[\n' + raw.map(function(q){ return '  ' + JSON.stringify(q); }).join(',\n') + '\n]\n';
  }
  var qs = (raw.questions || []).map(function(q){ return '    ' + JSON.stringify(q); }).join(',\n');
  var head = Object.keys(raw)
    .filter(function(k){ return k !== 'questions'; })
    .map(function(k){ return '  ' + JSON.stringify(k) + ': ' + JSON.stringify(raw[k], null, 2).replace(/\n/g, '\n  '); })
    .join(',\n');
  return '{\n' + (head ? head + ',\n' : '') + '  "questions": [\n' + qs + '\n  ]\n}\n';
}

function addMsg(kind, title, lines){
  var box = $('addResult');
  clear(box);
  box.className = 'result ' + kind;
  box.appendChild(el('b', null, title));
  if(lines && lines.length){
    var ul = el('ul');
    lines.forEach(function(t){ ul.appendChild(el('li', null, t)); });
    box.appendChild(ul);
  }
}

function addCheck(){
  hide($('addSaveWrap')); hide($('addManual'));
  addPending = null;

  var txt = $('addTa').value.trim();
  if(!txt){ addMsg('ng', 'JSON を貼り付けてください。'); return; }

  var parsed;
  try{ parsed = JSON.parse(txt); }
  catch(e){ addMsg('ng', 'JSON として読めませんでした。', [e.message, 'コードブロックの ```json や前後の説明文が混ざっていないか確認してください。']); return; }

  var incoming = Array.isArray(parsed) ? parsed
               : (parsed && Array.isArray(parsed.questions) ? parsed.questions : [parsed]);
  var newChapters = (parsed && !Array.isArray(parsed) && parsed.chapters) ? parsed.chapters : null;
  if(!incoming.length){ addMsg('ng', '追加する問題が入っていません。'); return; }

  var candidate = mergeRaw(RAW_DATA, incoming, newChapters);
  var res;
  try{ res = parseData(candidate); }
  catch(e){ addMsg('ng', '取り込めませんでした。', [e.message]); return; }

  var have = {};
  QUESTIONS.forEach(function(q){ have[q.id] = true; });
  var fresh = res.list.filter(function(q){ return !have[q.id]; });

  if(!fresh.length){
    addMsg('ng', '新しく追加される問題がありませんでした。', 
      ['id が既存とかぶっている可能性があります（かぶった問題は取り込まれません）。',
       '今の最大 id は ' + QUESTIONS.map(function(q){ return Number(q.id) || 0; })
         .reduce(function(a, b){ return a > b ? a : b; }, 0) + ' です。']);
    return;
  }

  var lines = [];
  var byCh = {};
  fresh.forEach(function(q){ byCh[q.chapter] = (byCh[q.chapter] || 0) + 1; });
  Object.keys(byCh).map(Number).sort(function(a, b){ return a - b; }).forEach(function(c){
    var isNew = CHAPTERS.indexOf(c) < 0;
    lines.push(chapterLabel(c) + ' ' + (res.titles[c] || '（タイトル未設定）') + ' … ' + byCh[c] + '問'
      + (isNew ? '  ← 新しい章' : ''));
  });
  var tags = [];
  fresh.forEach(function(q){ if(q.tag && tags.indexOf(q.tag) < 0) tags.push(q.tag); });
  if(tags.length) lines.push('タグ: ' + tags.join(' '));

  var skipped = incoming.length - fresh.length;
  if(skipped > 0) lines.push('⚠ ' + skipped + '件は取り込まれません（id の重複か形式エラー）');
  res.warnings.forEach(function(w){ lines.push('⚠ ' + w); });

  addMsg('ok', fresh.length + '問を追加します（合計 ' + res.list.length + '問になります）', lines);
  addPending = candidate;

  if(canPublish()) show($('addSaveWrap')); else show($('addManual'));
}

/* 自分自身を新しいバージョンとして保存できるか */
function canPublish(){
  return !!(document.getElementById('appStyle') &&
            document.getElementById('bodyTpl') &&
            document.getElementById('appScript') &&
            window.claude && typeof window.claude.use === 'function');
}

/* 保存する版のHTMLを組み立てる。画面の今の状態ではなく、
   「元のマークアップ＋新しいデータ」から必ず作り直す。 */
function buildDocument(rawData){
  var st = document.getElementById('appStyle');
  var tp = document.getElementById('bodyTpl');
  var ap = document.getElementById('appScript');
  if(!st || !tp || !ap) return null;
  var C  = '<' + '/script>';
  var SO = '<' + 'script';
  var json = JSON.stringify(rawData).replace(/<\//g, '<\\/');
  return [
    '<!doctype html>',
    '<html lang="ja">',
    '<head>',
    '<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
    '<meta name="color-scheme" content="light dark">',
    '<title>' + document.title + '<' + '/title>',
    '<style id="appStyle">' + st.textContent + '<' + '/style>',
    '</head>',
    '<body>',
    SO + ' type="application/json" id="quizData">' + json + C,
    SO + ' type="text/plain" id="bodyTpl">' + tp.textContent + C,
    '<div id="root"></div>',
    SO + ' id="appScript">' + ap.textContent + C,
    '</body>',
    '</html>',
    ''
  ].join('\n');
}

function addSave(){
  if(!addPending) return;
  var btn = $('addSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存しています…';

  var html = buildDocument(addPending);
  if(!html){
    addMsg('ng', 'この画面では保存できません。'); 
    hide($('addSaveWrap')); show($('addManual'));
    btn.disabled = false; btn.textContent = 'この内容で保存';
    return;
  }

  window.claude.use('artifact').then(function(api){
    if(!api) throw new Error('not_granted');
    return api.publish(html);
  }).then(function(){
    addMsg('ok', '保存しました。新しい問題を読み込みます…');
    btn.textContent = '保存しました';
  }).catch(function(e){
    var code = (e && (e.code || e.message)) || '';
    btn.disabled = false; btn.textContent = 'この内容で保存';
    if(String(code).indexOf('conflict') >= 0){
      addMsg('ng', '別の端末で先に保存されたようです。', ['画面を読み込み直してから、もう一度貼り付けてください。']);
    }else if(String(code).indexOf('not_granted') >= 0 || String(code).indexOf('not_writer') >= 0){
      addMsg('ng', 'このビューには保存する権限がありません。', ['作成者本人として開いてください。']);
      hide($('addSaveWrap')); show($('addManual'));
    }else{
      addMsg('ng', '保存できませんでした。', [String(code)]);
      show($('addManual'));
    }
  });
}

function addCopy(){
  if(!addPending) return;
  var text = formatData(addPending);
  var btn = $('addCopyBtn');
  var done = function(okFlag){
    btn.textContent = okFlag ? 'コピーしました' : 'コピーできませんでした';
    window.setTimeout(function(){ btn.textContent = '追記後の JSON 全文をコピー'; }, 2000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallbackCopy(text, done); });
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var okFlag = false;
  try{ okFlag = document.execCommand('copy'); }catch(e){ okFlag = false; }
  document.body.removeChild(ta);
  done(okFlag);
}

function openAdd(){
  $('addTa').value = '';
  clear($('addResult'));
  $('addResult').className = '';
  hide($('addSaveWrap')); hide($('addManual'));
  addPending = null;
  goto('screenAdd');
}

/* ============================================================
   10. テーマ
   ============================================================ */
/* アーティファクトとして iframe 内で動くときは、テーマは閲覧者の設定に従って
   ホストが data-theme を付ける。こちらが触ると上書きしてしまうので何もしない。 */
var HOST_THEME;
try{ HOST_THEME = (window.self !== window.top); }
catch(e){ HOST_THEME = true; }   /* クロスオリジンで参照できない＝埋め込まれている */

function applyTheme(v){
  var root = document.documentElement;
  if(HOST_THEME){ hide($('themeBtn')); return; }
  if(v === 'light' || v === 'dark') root.setAttribute('data-theme', v);
  else root.removeAttribute('data-theme');
  var b = $('themeBtn');
  b.textContent = v === 'light' ? '☀️' : (v === 'dark' ? '🌙' : '🌓');
  b.title = '表示テーマ：' + (v === 'light' ? 'ライト' : v === 'dark' ? 'ダーク' : '端末の設定に従う');
  b.setAttribute('aria-label', b.title + '（切り替え）');
}
function cycleTheme(){
  var cur = loadTheme();
  var nextV = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
  saveTheme(nextV);
  applyTheme(nextV);
}

/* ============================================================
   11. イベント配線
   ============================================================ */
function wire(){
  $('themeBtn').addEventListener('click', cycleTheme);
  $('homeBtn').addEventListener('click', function(){ session = null; renderHome(); goto('screenHome'); });

  $('modeAll').addEventListener('click',    function(){ startSession('all'); });
  $('modeWrong').addEventListener('click',  function(){ startSession('wrong'); });
  $('modeRecent').addEventListener('click', function(){ startSession('recent'); });

  $('nextBtn').addEventListener('click', next);

  $('againBtn').addEventListener('click', function(){
    if(session) startSession(session.mode, session.chapter);
  });
  $('retryWrongBtn').addEventListener('click', function(){ startSession('wrong'); });
  $('toHomeBtn').addEventListener('click', function(){ session = null; renderHome(); goto('screenHome'); });

  $('addBtn').addEventListener('click', openAdd);
  $('addBackBtn').addEventListener('click', function(){ renderHome(); goto('screenHome'); });
  $('addCheckBtn').addEventListener('click', addCheck);
  $('addSaveBtn').addEventListener('click', addSave);
  $('addCopyBtn').addEventListener('click', addCopy);

  $('resetBtn').addEventListener('click', function(){
    if(!window.confirm('学習履歴（正誤・セッション履歴）をすべて消します。よろしいですか？')) return;
    state = blankState();
    try{ localStorage.removeItem(LS_KEY); }catch(e){ /* 消せなくてもメモリ上はリセット済み */ }
    saveState();
    renderHome();
  });

  // キーボード操作（PCで速く回す用）
  document.addEventListener('keydown', function(e){
    if($('screenQuiz').classList.contains('hidden')) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

    if(!locked && /^[1-6]$/.test(e.key)){
      var i = parseInt(e.key, 10) - 1;
      if(session && i < session.list[session.idx].options.length){ e.preventDefault(); answer(i); }
      return;
    }
    if(locked && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); next(); }
  });

  $('filePick').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{ boot(JSON.parse(String(rd.result))); }
      catch(err){ showError('選んだファイルを JSON として読めませんでした： ' + err.message); }
    };
    rd.onerror = function(){ showError('ファイルの読み込みに失敗しました。'); };
    rd.readAsText(f, 'utf-8');
  });
}

/* ============================================================
   12. 起動
   ============================================================ */
function showError(msg){
  $('errMsg').textContent = msg;
  goto('screenError');
}

function boot(raw){
  try{
    QUESTIONS = normalize(raw);
    RAW_DATA  = raw;
  }catch(e){
    showError(e.message);
    return;
  }
  if(loadWarnings.length){
    try{ console.warn('[quiz] 読み込めなかった問題:\n- ' + loadWarnings.join('\n- ')); }catch(_){}
  }
  state = loadState();
  renderHome();
  goto('screenHome');
}

function init(){
  applyTheme(loadTheme());
  wire();
  goto('screenLoading');

  /* アーティファクト版は問題データをページ内に持つ。その場合は fetch しない。 */
  var embedded = document.getElementById('quizData');
  if(embedded){
    try{ boot(JSON.parse(embedded.textContent)); return; }
    catch(e){ showError('埋め込まれた問題データを読めませんでした: ' + e.message); return; }
  }
  if(window.QUIZ_DATA){ boot(window.QUIZ_DATA); return; }

  fetch(DATA_URL, { cache:'no-cache' })
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(boot)
    .catch(function(e){
      showError(String(e && e.message ? e.message : e));
    });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
